name: FUSOU release eligibility

on:
  workflow_run:
    workflows: [FUSOU tag validation]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  eligibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
      - name: Independently evaluate the run and current tag using trusted main code
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          PUBLIC_BUILD_INPUT_SHA256: ${{ vars.FUSOU_RELEASE_PUBLIC_INPUTS_SHA256 }}
          WORKER_BUILD_ENABLED: ${{ vars.FUSOU_RELEASE_WORKER_BUILD_ENABLED }}
          SOURCE_READ_TOKEN: ${{ github.token }}
          CHECK_INPUT_SHA256: ${{ vars.FUSOU_RELEASE_CHECK_INPUTS_SHA256 }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { execFileSync } = require('node:child_process');
            const { writeFileSync, readFileSync, mkdtempSync, rmSync } = require('node:fs');
            const { tmpdir } = require('node:os');
            const { join } = require('node:path');
            const { evaluateReleaseRun } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/release-eligibility.mjs`).href);
            const trustedSha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            let report;
            try {
              if (context.ref !== 'refs/heads/main' || trustedSha !== context.sha) {
                throw new Error('coordinator must use the immutable main workflow event SHA');
              }
              report = await evaluateReleaseRun({
                github, repository: context.repo, runId: context.payload.workflow_run.id, trustedSha,
              });
              report.eligibility_run = {
                run_id: context.runId, run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT), coordinator_sha: trustedSha,
              };
            } catch (error) {
              report = { schema_version: 2, status: 'TAG_INVALID', error: error.message, deployed: false };
            }
            if (report.status === 'PRODUCTION_ELIGIBLE') {
              let buildWorkspace;
              try {
                const { generateReleaseBuild } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/release-build.mjs`).href);
                let publicInputsBytes;
                if (process.env.PUBLIC_BUILD_INPUT_SHA256) {
                  try {
                    publicInputsBytes = readFileSync('scripts/release-public-build-inputs.json');
                  } catch (error) {
                    if (error.code !== 'ENOENT') throw error;
                  }
                }
                buildWorkspace = mkdtempSync(join(tmpdir(), 'fusou-unsigned-release-'));
                report.build = await generateReleaseBuild({
                  workerBuildAuthorized: process.env.WORKER_BUILD_ENABLED === 'true',
                  eligibility: report, publicInputsBytes,
                  publicInputsSha256: process.env.PUBLIC_BUILD_INPUT_SHA256,
                  workspace: buildWorkspace,
                  outputDirectory: join(process.env.GITHUB_WORKSPACE, 'release-output'),
                  runId: context.runId, runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
                  sourceToken: process.env.SOURCE_READ_TOKEN,
                }, {
                  recheckEligibility: () => evaluateReleaseRun({
                    github, repository: context.repo, runId: context.payload.workflow_run.id, trustedSha,
                  }),
                });
              } catch (error) {
                report.build = { status: 'FAIL', error: error instanceof SyntaxError ?
                  'public release input JSON is malformed' : error.message, deployed: false };
              } finally {
                if (buildWorkspace) rmSync(buildWorkspace, { recursive: true });
              }
            }
            if (report.status === 'PRODUCTION_ELIGIBLE') {
              const { inspectWorkerSourceAt } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/release-worker-source.mjs`).href);
              report.worker_source = await inspectWorkerSourceAt(github, report.commit_sha);
            }
            const { readRegularFile } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/release-build.mjs`).href);
            let capturedChecks = new Map();
            if (report.status === 'PRODUCTION_ELIGIBLE' && report.build?.status === 'BUILD_OUTPUTS_GENERATED') {
              const { collectReleaseEvidence } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/release-evidence-producer.mjs`).href);
              let checkPolicyBytes;
              if (process.env.CHECK_INPUT_SHA256) {
                try { checkPolicyBytes = await readRegularFile('scripts/release-check-public-inputs.json'); }
                catch (error) { if (error.code !== 'ENOENT') throw error; }
              }
              const production = await collectReleaseEvidence({
                report, checkPolicyBytes, checkPolicySha256: process.env.CHECK_INPUT_SHA256,
                evidenceDirectory: join(process.env.GITHUB_WORKSPACE, 'release-evidence'),
                identity: {
                  repository: `${context.repo.owner}/${context.repo.repo}`, workflow_ref: process.env.GITHUB_WORKFLOW_REF,
                  event_name: context.eventName, ref: context.ref, workflow_sha: trustedSha,
                  run_id: context.runId, run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
                },
              });
              report.evidence_production = production.report;
              capturedChecks = production.executions;
            }
            const { packProducerTransport: packCapturedProducerTransport } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/release-transport.mjs`).href);
            const transport = await packCapturedProducerTransport(report,
              (name) => readRegularFile(join(process.env.GITHUB_WORKSPACE, 'release-output', name)), { capturedChecks });
            writeFileSync('release-transport.json', transport);
            await core.summary.addCodeBlock(JSON.stringify(report, null, 2), 'json').write();
            if (report.status === 'TAG_INVALID' || report.build?.status === 'FAIL') {
              core.setFailed(`Release gate: ${report.status}, build: ${report.build?.status}`);
            }
      - name: Preserve the machine-readable report, including blocked and failed runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fusou-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-transport.json
          if-no-files-found: error
