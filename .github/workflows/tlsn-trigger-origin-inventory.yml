name: TLSN Trigger Origin Inventory Contract

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    paths:
      - packages/fusou-tlsn-trigger/**
      - packages/configs/tlsn-origin-inventory.json
      - packages/FUSOU-TLSN-VERIFICATION-WORKER/configs/tlsn-origin-inventory.json.txt
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/tlsn-trigger-origin-inventory.yml
  pull_request:
    paths:
      - packages/fusou-tlsn-trigger/**
      - packages/configs/tlsn-origin-inventory.json
      - packages/FUSOU-TLSN-VERIFICATION-WORKER/configs/tlsn-origin-inventory.json.txt
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/tlsn-trigger-origin-inventory.yml

jobs:
  origin-inventory-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify canonical, Worker, and Trigger inventory identity
        run: pnpm --dir packages/fusou-tlsn-trigger run test:origin-inventory-contract
