name: TLSN Verification Worker Security Contracts

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    paths:
      - packages/FUSOU-TLSN-VERIFIER/**
      - packages/FUSOU-TLSN-VERIFICATION-WORKER/**
      - packages/fusou-tlsn-trigger/**
      - packages/FUSOU-APP/**
      - packages/FUSOU-PROXY/proxy-https/**
      - packages/FUSOU-PROXY/hudsucker-fork/**
      - packages/kc_api/**
      - packages/configs/**
      - packages/fusou-auth/**
      - packages/fusou-upload/**
      - packages/fusou-storage/**
      - packages/tlsn-alpha15-sparse/**
      - packages/tlsn-mux-alpha15/**
      - packages/configs/configs.toml
      - packages/configs/tlsn-origin-inventory.json
      - packages/configs/tlsn-origin-inventory.json.txt
      - packages/configs/tlsn-target-approval.json
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/tlsn-verification-worker-security.yml
  pull_request:
    paths:
      - packages/FUSOU-TLSN-VERIFIER/**
      - packages/FUSOU-TLSN-VERIFICATION-WORKER/**
      - packages/fusou-tlsn-trigger/**
      - packages/FUSOU-APP/**
      - packages/FUSOU-PROXY/proxy-https/**
      - packages/FUSOU-PROXY/hudsucker-fork/**
      - packages/kc_api/**
      - packages/configs/**
      - packages/fusou-auth/**
      - packages/fusou-upload/**
      - packages/fusou-storage/**
      - packages/tlsn-alpha15-sparse/**
      - packages/tlsn-mux-alpha15/**
      - packages/configs/configs.toml
      - packages/configs/tlsn-origin-inventory.json
      - packages/configs/tlsn-origin-inventory.json.txt
      - packages/configs/tlsn-target-approval.json
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/tlsn-verification-worker-security.yml

jobs:
  canary-runtime-attestation-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install pinned Rust WASM toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision pinned WASM code generation tools
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
          RUSTUP_AUTO_INSTALL: "0"
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          cargo install wasm-pack --version 0.13.1 --locked

          tool_root="$RUNNER_TEMP/fusou-wasm-tools"
          mkdir -p "$tool_root/bin" "$tool_root/downloads"

          wasm_bindgen_archive="$tool_root/downloads/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.128/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl.tar.gz" \
            --output "$wasm_bindgen_archive"
          echo "b51f0208fdff83515a787bd8ab9ac5865ed84dabb66d0c709957bb59793c645f  $wasm_bindgen_archive" | sha256sum --check --strict
          mkdir -p "$tool_root/wasm-bindgen"
          tar -xzf "$wasm_bindgen_archive" -C "$tool_root/wasm-bindgen"
          wasm_bindgen_binary="$(find "$tool_root/wasm-bindgen" -type f -name wasm-bindgen -print -quit)"
          test -n "$wasm_bindgen_binary"
          install -m 0755 "$wasm_bindgen_binary" "$tool_root/bin/wasm-bindgen"
          echo "$tool_root/bin" >> "$GITHUB_PATH"

          binaryen_archive="$tool_root/downloads/binaryen-version_133-x86_64-linux.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz" \
            --output "$binaryen_archive"
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  $binaryen_archive" | sha256sum --check --strict
          mkdir -p "$tool_root/binaryen"
          tar -xzf "$binaryen_archive" -C "$tool_root/binaryen"
          wasm_opt_binary="$(find "$tool_root/binaryen" -type f -name wasm-opt -print -quit)"
          test -n "$wasm_opt_binary"
          binaryen_bin="$(dirname "$wasm_opt_binary")"
          echo "$binaryen_bin" >> "$GITHUB_PATH"
          export PATH="$tool_root/bin:$binaryen_bin:$PATH"

          wasm-pack --version
          wasm-bindgen --version
          wasm-opt --version
          clang --version

      - name: Fetch locked WASM build dependencies
        run: cargo fetch --locked --manifest-path packages/FUSOU-TLSN-VERIFIER/Cargo.toml
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
          RUSTUP_AUTO_INSTALL: "0"

      - name: Fetch locked proxy HTTPS offline-test dependencies
        run: cargo fetch --locked --manifest-path packages/FUSOU-PROXY/proxy-https/Cargo.toml

      - name: Build WASM verifier from checked-out source
        run: pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run build:wasm

      - name: Verify WASM source commit and artifact hashes
        run: pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run verify:wasm-provenance

      - name: Verify WASM provenance contract
        run: pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run test:wasm-provenance

      - name: Verify Runtime Attestation signer registry
        run: pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run test:canary-runtime-attestation-registry

      - name: Verify Runtime Attestation cryptography
        run: pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run test:canary-runtime-attestation-signing

      - name: Verify Runtime Attestation preflight lifecycle
        run: pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run test:canary-runtime-attestation-preflight

      - name: Verify Runtime Attestation private-key boundary
        run: pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run test:canary-runtime-attestation-secret-boundary

      - name: Verify deployment manifest contract
        run: pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run test:canary-deployment-manifest

      - name: Verify deployment Runtime Attestation contract
        run: pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run test:canary-deployment-attestation

      - name: Verify Worker secret boundary contract
        run: pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run test:secret-boundary

      - name: Verify readiness signature and binding gates
        run: pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run test:canary-readiness-contract

      - name: Verify Target Approval contract
        run: pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run test:target-approval-contract

      - name: Verify Canary Verifier execution receipt evidence
        run: pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run test:canary-execution-evidence

      - name: Verify Canary Verifier identity contract
        run: pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run test:canary-verifier-identity

      - name: Verify Canary Verifier health keypair
        run: pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run test:canary-verifier-health

      - name: Verify independent APP Production deployment handoff
        run: pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run test:app-worker-reference

      - name: Verify Canary runtime security contract
        run: pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run test:canary-runtime-security-contract

      - name: Verify Canary Main and Verifier execution boundary
        run: pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run test:canary-execution-boundary

      - name: Verify exact authoritative Result byte binding
        run: pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run test:canary-result-byte-binding

      - name: Verify Canary operational smoke evidence
        run: pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run test:canary-operational-smoke

      - name: Verify Complete and Sparse Worker Result signing
        run: pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run test:worker-result-signing

      - name: Verify Production evidence capture and independent re-approval
        run: pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run test:production-evidence

      - name: Verify Trigger Result ABI and Origin approval contracts
        run: |
          pnpm --dir packages/fusou-tlsn-trigger run typecheck
          pnpm --dir packages/fusou-tlsn-trigger run typecheck:config
          pnpm --dir packages/fusou-tlsn-trigger run test:origin-inventory-contract
          pnpm --dir packages/fusou-tlsn-trigger run test:origin-profile
          pnpm --dir packages/fusou-tlsn-trigger run test:origin-deployment-config
          pnpm --dir packages/fusou-tlsn-trigger run test:verification-task-contract

      - name: Verify APP-only synthetic binding and capture regressions
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          cargo test --locked --manifest-path packages/FUSOU-PROXY/proxy-https/Cargo.toml --features synthetic-tlsn --lib real_tlsn::tests::remote_worker_clients_reject_cross_endpoint_redirects -- --exact
          cargo test --locked --manifest-path packages/FUSOU-PROXY/proxy-https/Cargo.toml --features synthetic-tlsn --lib real_tlsn::tests::candidate_bundle_preserves_exact_response_and_receipt_without_overwrite -- --exact
          cargo test --locked --manifest-path packages/FUSOU-PROXY/proxy-https/Cargo.toml --features synthetic-tlsn --lib real_tlsn::tests::remote_session_binding_constructor_rejects_invalid_endpoint_and_signer_inputs -- --exact
          pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run test:app-roundtrip

      - name: Verify fixture isolation
        run: pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run test:fixture-only

      - name: Verify external input classification
        run: pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run test:canary-input-intake

  production-roundtrip:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.95.0

      - name: Install APP Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch locked FUSOU-APP dependencies (fresh Cargo home)
        env:
          CARGO_HOME: ${{ runner.temp }}/fusou-app-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/fusou-app-cargo-target
        run: cargo fetch --locked --manifest-path packages/FUSOU-APP/src-tauri/Cargo.toml

      - name: Run offline Production roundtrip (Cargo cache disabled)
        env:
          CARGO_HOME: ${{ runner.temp }}/fusou-app-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/fusou-app-cargo-target
          CARGO_NET_OFFLINE: "true"
        run: |
          echo "Cargo.lock: packages/FUSOU-APP/src-tauri/Cargo.lock"
          echo "cargo fetch: --locked"
          echo "network mode: CARGO_NET_OFFLINE=true"
          echo "Cargo dependency cache: disabled; fresh CARGO_HOME=$CARGO_HOME"
          echo "Cargo target: $CARGO_TARGET_DIR"
          pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run test:production-roundtrip

  app-build-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.95.0

      - name: Install APP Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch locked APP dependencies into fresh Cargo home
        env:
          CARGO_HOME: ${{ runner.temp }}/fusou-app-cargo-home
        run: cargo fetch --locked --manifest-path packages/FUSOU-APP/src-tauri/Cargo.toml

      - name: Verify actual APP binary dotenvx inputs and approved-reference handoff (public-only encrypted fixture, mock control plane)
        env:
          CARGO_HOME: ${{ runner.temp }}/fusou-app-cargo-home
          CARGO_NET_OFFLINE: "true"
        run: pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run test:app-build-handoff-smoke

      - name: Verify APP public-configuration Rust unit test (exactly one public-fixture test)
        shell: bash
        run: |
          test_name=app_public_configuration::tests::public_configuration_requires_auth_and_binds_optional_discord
          test_log="${{ runner.temp }}/app-public-configuration-rust-unit.log"
          env -i \
            PATH="$PATH" HOME="$HOME" \
            RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" RUSTUP_AUTO_INSTALL=0 \
            CARGO_HOME="${{ runner.temp }}/fusou-app-cargo-home" \
            CARGO_TARGET_DIR="${{ runner.temp }}/fusou-app-public-configuration-target" \
            CARGO_NET_OFFLINE=true \
            cargo +1.95.0 test --locked --manifest-path packages/FUSOU-APP/src-tauri/Cargo.toml \
              --features tlsn-production --lib "$test_name" -- --exact \
            2>&1 | tee "$test_log"
          grep -Fx "test $test_name ... ok" "$test_log"
          grep -E '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$test_log"
          echo 'APP public-configuration Rust unit: PASS=1 FAIL=0 SKIP=0'
