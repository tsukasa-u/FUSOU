# https://docs.github.com/en/actions/concepts/runners/github-hosted-runners

name: check build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "packages/FUSOU-APP/**"
      - "packages/configs/**"
      - "packages/kc_api/**"
      - "packages/fusou-*/**"
      - "packages/FUSOU-PROXY/**"
      - "packages/avro-wasm/**"
      - ".github/workflows/check_build.yml"

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Checkout FUSOU-TESTDATA
        uses: actions/checkout@v4
        with:
          repository: tsukasa-u/FUSOU-TESTDATA
          path: FUSOU-TESTDATA
      - name: Link FUSOU-TESTDATA to parent directory
        run: ln -s "$GITHUB_WORKSPACE/FUSOU-TESTDATA" "$GITHUB_WORKSPACE/../FUSOU-TESTDATA"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter fusou-workflow test
      - run: pnpm --filter fusou-workflow typecheck
      - run: pnpm --filter @fusou/compaction-core test
      - run: pnpm --filter fusou-app check.tsc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fusou-datasets test dependencies
        run: python -m pip install -e "packages/fusou-datasets/python[dev]"
      - name: Test fusou-datasets
        run: python -m pytest packages/fusou-datasets/python/tests

  check_config:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: test configs default vs toml
        run: |
          cd ./packages/configs
          cargo test --lib configs::tests:: -- --nocapture

  build:
    defaults:
      run:
        working-directory: ./packages/FUSOU-APP
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # - platform: "macos-latest" # for Arm based macs (M1 and above).
          #   args: "--target aarch64-apple-darwin"
          #   SCCACHE_GHA_ENABLED: "true"
          #   RUSTC_WRAPPER: "sccache"
          # - platform: "macos-latest" # for Intel based macs.
          #   args: "--target x86_64-apple-darwin"
          #   SCCACHE_GHA_ENABLED: "true"
          #   RUSTC_WRAPPER: "sccache"
          - platform: "ubuntu-24.04"
            args: ""
            SCCACHE_GHA_ENABLED: "true"
            RUSTC_WRAPPER: "sccache"
          - platform: "windows-latest"
            args: ""
            SCCACHE_GHA_ENABLED: "true"
            RUSTC_WRAPPER: "sccache"
          # ARM builders are excluded from PR checks to reduce GitHub Actions minutes.
          # Full ARM release bundles are built in publish_and_create_version_tag.yml.
          # - platform: "ubuntu-24.04-arm"
          #   args: ""
          #   SCCACHE_GHA_ENABLED: "true"
          #   RUSTC_WRAPPER: "sccache"
          # - platform: "windows-11-arm"
          #   args: ""
          #   SCCACHE_GHA_ENABLED: "false"
          #   RUSTC_WRAPPER: ""

    runs-on: ${{ matrix.platform }}
    env:
      RUSTC_WRAPPER: ${{ matrix.RUSTC_WRAPPER }}
      SCCACHE_GHA_ENABLED: ${{ matrix.SCCACHE_GHA_ENABLED }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04' || matrix.platform == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install dependencies (ubuntu arm only)
        if: matrix.platform == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get install -y xdg-utils

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable # Set this to dtolnay/rust-toolchain@nightly
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          #   targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
          targets: ${{ '' }}

      - name: Run sccache-cache
        if: matrix.SCCACHE_GHA_ENABLED == 'true'
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: build without bundling (pull request)
        if: github.event_name == 'pull_request'
        run: node node_modules/@tauri-apps/cli/tauri.js build --no-bundle --ci -- --locked

      - uses: tauri-apps/tauri-action@v0
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          projectPath: ./packages/FUSOU-APP
