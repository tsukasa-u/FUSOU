name: TLSN testplay candidate checks

on:
  push:
    branches:
      - tlsn-first-testplay-candidate
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-contract-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Install wasm32-unknown-unknown target
        run: rustup target add --toolchain 1.98.1 wasm32-unknown-unknown

      - name: Cache pinned wasm-pack release archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/wasm-pack-download
          key: wasm-pack-Linux-X64-0.15.1-410101009739b9d01c7d5affaaad6e9c9a24b4cba6791a4805db8e89b9bf7af2

      - name: Install and verify official wasm-pack 0.15.1
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          # Pin the official release and digest; never resolve "latest" during CI.
          version=0.15.1
          target=x86_64-unknown-linux-musl
          digest=410101009739b9d01c7d5affaaad6e9c9a24b4cba6791a4805db8e89b9bf7af2
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          archive_dir="$RUNNER_TEMP/wasm-pack-download"
          wasm_pack_dir="$RUNNER_TEMP/wasm-pack-$version/bin"
          mkdir -p "$archive_dir" "$wasm_pack_dir"
          archive="$archive_dir/wasm-pack-v$version-$target.tar.gz"
          # Download to a temporary file so a failed transfer cannot become a cache hit.
          if [[ ! -f "$archive" ]]; then
            partial="$(mktemp "$archive_dir/download.XXXXXX")"
            trap 'rm -f "$partial"' EXIT
            curl --fail --location --silent --show-error \
              --proto '=https' --proto-redir '=https' \
              --connect-timeout 10 --max-time 45 \
              --retry 4 --retry-max-time 180 --retry-connrefused \
              "https://github.com/wasm-bindgen/wasm-pack/releases/download/v$version/wasm-pack-v$version-$target.tar.gz" \
              --output "$partial"
            printf '%s  %s\n' "$digest" "$partial" | sha256sum --check
            mv "$partial" "$archive"
            trap - EXIT
          fi
          # Validate cache hits too, before extracting or executing any binary.
          printf '%s  %s\n' "$digest" "$archive" | sha256sum --check
          tar -xzf "$archive" --directory "$wasm_pack_dir" --strip-components=1 \
            "wasm-pack-v$version-$target/wasm-pack"
          chmod 755 "$wasm_pack_dir/wasm-pack"
          test "$("$wasm_pack_dir/wasm-pack" --version)" = "wasm-pack $version"
          printf '%s\n' "$wasm_pack_dir" >> "$GITHUB_PATH"
          export PATH="$wasm_pack_dir:$PATH"
          # pnpm prepends this directory. Replace its lazy-download shim with the
          # verified executable so avro and Worker builds use the same release.
          ln -sf "$wasm_pack_dir/wasm-pack" \
            "$GITHUB_WORKSPACE/packages/avro-wasm/node_modules/.bin/wasm-pack"
          test "$(pnpm --dir packages/avro-wasm exec wasm-pack --version)" = "wasm-pack $version"
          resolved="$(
            node --input-type=module -e '
              import { resolveWasmPackCommand } from "./packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/wasm-provenance.mjs";
              import { resolve } from "node:path";
              console.log(resolveWasmPackCommand(resolve("packages/FUSOU-TLSN-VERIFICATION-WORKER")));
            '
          )"
          if [[ "$resolved" == "wasm-pack" ]]; then
            resolved="$(command -v wasm-pack)"
          fi
          test "$(readlink -f "$resolved")" = "$wasm_pack_dir/wasm-pack"
          resolved_version="$("$resolved" --version)"
          echo "Worker build resolves ${resolved} (${resolved_version})"
          test "${resolved_version}" = "wasm-pack $version"

      - name: Build avro-wasm for WEB typecheck
        run: pnpm --dir packages/avro-wasm run build

      - name: Verify generated avro-wasm module
        run: test -s packages/avro-wasm/pkg/avro_wasm.js

      - name: Verify APP Cargo.lock is committed and not ignored
        shell: bash
        run: |
          set -euo pipefail
          lockfile=packages/FUSOU-APP/src-tauri/Cargo.lock
          git ls-files --error-unmatch -- "$lockfile"
          if git check-ignore --quiet --no-index -- "$lockfile"; then
            echo "APP Cargo.lock is still ignored" >&2
            exit 1
          else
            status=$?
            if [[ "$status" -ne 1 ]]; then
              exit "$status"
            fi
          fi

      - name: Run APP clean-capture tests
        run: pnpm --dir packages/FUSOU-APP run test:clean-capture

      - name: Fetch locked APP Rust verifier dependencies
        run: cargo +1.98.1 fetch --locked --manifest-path packages/FUSOU-APP/src-tauri/Cargo.toml
        env:
          CARGO_NET_OFFLINE: "false"
          RUSTUP_TOOLCHAIN: "1.98.1"
          RUSTUP_AUTO_INSTALL: "0"

      - name: Install isolated proof test database tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16

      - name: Verify owner proof handlers and atomic database consumption
        working-directory: packages/FUSOU-WEB
        run: |
          pnpm exec tsc --noEmit --pretty false
          pnpm exec vitest run \
            src/server/routes/__tests__/tlsn-device-proof.integration.test.ts \
            src/server/routes/__tests__/anonymous-sync-v2-endpoints.test.ts \
            src/server/routes/__tests__/anonymous-sync-v2.test.ts \
            src/server/schemas/__tests__/anonymous-sync-v2.test.ts

      - name: Install pinned wasm-compatible Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18=1:18.1.3-1ubuntu1

      - name: Install pinned wasm-bindgen and Binaryen
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: "1.98.1"
          RUSTUP_AUTO_INSTALL: "0"
        run: |
          set -euo pipefail
          cargo +1.98.1 install wasm-bindgen-cli --version 0.2.128 --locked \
            --root "$RUNNER_TEMP/wasm-bindgen-cli"
          printf '%s\n' "$RUNNER_TEMP/wasm-bindgen-cli/bin" >> "$GITHUB_PATH"

          wasm_opt_archive="$RUNNER_TEMP/binaryen-version_133-x86_64-linux.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz \
            --output "$wasm_opt_archive"
          printf '%s  %s\n' \
            2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489 \
            "$wasm_opt_archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/binaryen-133"
          tar -xzf "$wasm_opt_archive" --directory "$RUNNER_TEMP/binaryen-133" --strip-components=1
          printf '%s\n' "$RUNNER_TEMP/binaryen-133/bin" >> "$GITHUB_PATH"

      - name: Verify Worker WASM toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc +1.98.1 --version
          rustup target list --installed --toolchain 1.98.1 | grep -Fxq wasm32-unknown-unknown
          test "$(wasm-bindgen --version)" = "wasm-bindgen 0.2.128"
          test "$(wasm-opt --version)" = "wasm-opt version 133 (version_133)"
          test "$(clang-18 --version | sed -n '1p')" = "Ubuntu clang version 18.1.3 (1ubuntu1)"

      - name: Fetch locked Worker WASM dependencies
        run: cargo +1.98.1 fetch --locked --manifest-path packages/FUSOU-TLSN-VERIFIER/Cargo.toml
        env:
          CARGO_NET_OFFLINE: "false"
          RUSTUP_TOOLCHAIN: "1.98.1"
          RUSTUP_AUTO_INSTALL: "0"

      - name: Test independent TLSN verifier, CLI, and candidate finalizer
        run: >-
          cargo +1.98.1 test --locked --offline
          --manifest-path packages/FUSOU-TLSN-VERIFIER/Cargo.toml
          --lib
          --bin verify_fusou_tlsn_evidence
        env:
          CARGO_NET_OFFLINE: "true"
          RUSTUP_TOOLCHAIN: "1.98.1"
          RUSTUP_AUTO_INSTALL: "0"

      - name: Build Worker verifier WASM with commit-bound offline provenance
        run: pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run build:wasm
        env:
          FUSOU_RELEASE_ALLOW_WASM_BUILD: "1"
          FUSOU_RELEASE_SOURCE_SHA: ${{ github.sha }}
          RUSTUP_TOOLCHAIN: "1.98.1"
          CARGO_NET_OFFLINE: "true"
          RUSTUP_AUTO_INSTALL: "0"
          CC_wasm32_unknown_unknown: clang-18

      - name: Verify all generated Worker WASM artifacts exist
        shell: bash
        run: |
          set -euo pipefail
          for artifact in \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/src/wasm/fusou_tlsn_verifier.js \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/src/wasm/fusou_tlsn_verifier.d.ts \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/src/wasm/fusou_tlsn_verifier_bg.wasm \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/src/wasm/fusou_tlsn_verifier_bg.wasm.d.ts \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/src/wasm/wasm-provenance.json; do
            test -s "$artifact"
          done

      - name: Verify Worker WASM provenance
        run: pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run verify:wasm-provenance
        env:
          FUSOU_RELEASE_ALLOW_WASM_BUILD: "1"
          FUSOU_RELEASE_SOURCE_SHA: ${{ github.sha }}
          RUSTUP_TOOLCHAIN: "1.98.1"
          CARGO_NET_OFFLINE: "true"
          RUSTUP_AUTO_INSTALL: "0"
          CC_wasm32_unknown_unknown: clang-18

      - name: Verify bounded Worker proof clients and replay collection
        run: |
          pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run typecheck
          node --experimental-strip-types --test \
            packages/FUSOU-TLSN-VERIFIER/scripts/collect-replay-observation.test.mjs \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/device-proof-client.test.mjs \
            scripts/release-worker-source.test.mjs \
            scripts/release-worker-integration.test.mjs

      - name: Install APP Rust integration build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Test Freshness, Production Result, and candidate readiness contracts
        run: |
          pnpm --dir packages/FUSOU-TLSN-RUNTIME-CONFIG-DOMAIN run typecheck
          pnpm --dir packages/FUSOU-TLSN-RUNTIME-CONFIG-DOMAIN run test
          pnpm --dir packages/FUSOU-TLSN-RUNTIME-CONFIG-FRESHNESS-GATEWAY run typecheck
          pnpm --dir packages/FUSOU-TLSN-RUNTIME-CONFIG-FRESHNESS-GATEWAY run test:runtime
          pnpm --dir packages/FUSOU-TLSN-RUNTIME-CONFIG-FRESHNESS-COORDINATOR run typecheck
          pnpm --dir packages/FUSOU-TLSN-RUNTIME-CONFIG-FRESHNESS-COORDINATOR run test:runtime
          node --experimental-strip-types --test \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/tlsn-runtime-config-freshness-test.mjs \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/production-result-contract.test.mjs \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/production-evidence-contract.test.mjs \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/production-evidence-trust-graph-test.mjs \
            packages/FUSOU-APP/scripts/testplay-acceptance-stages.test.mjs \
            packages/FUSOU-APP/scripts/testplay-pre-capture-readiness.test.mjs

      - name: Verify isolated Manifest harness Cargo.lock is committed and not ignored
        shell: bash
        run: |
          set -euo pipefail
          lockfile=packages/FUSOU-APP/src-tauri/manifest-verification-harness/Cargo.lock
          test -f "$lockfile"
          git ls-files --error-unmatch -- "$lockfile"
          if git check-ignore --quiet --no-index -- "$lockfile"; then
            echo "Manifest harness Cargo.lock is still ignored" >&2
            exit 1
          else
            status=$?
            if [[ "$status" -ne 1 ]]; then
              exit "$status"
            fi
          fi

      - name: Fetch locked isolated APP-source Manifest harness dependencies
        run: >-
          cargo +1.98.1 fetch --locked
          --manifest-path packages/FUSOU-APP/src-tauri/manifest-verification-harness/Cargo.toml
        env:
          CARGO_NET_OFFLINE: "false"
          RUSTUP_TOOLCHAIN: "1.98.1"
          RUSTUP_AUTO_INSTALL: "0"

      - name: Run isolated APP-source Manifest verification suite
        run: >-
          cargo +1.98.1 test --locked --offline --all-targets
          --manifest-path packages/FUSOU-APP/src-tauri/manifest-verification-harness/Cargo.toml
        env:
          CARGO_NET_OFFLINE: "true"
          CARGO_TARGET_DIR: ${{ runner.temp }}/fusou-manifest-verification-harness-target
          RUSTUP_TOOLCHAIN: "1.98.1"
          RUSTUP_AUTO_INSTALL: "0"

      - name: Run APP build handoff and Worker reference tests
        run: |
          node --experimental-strip-types \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/generate-runtime-config-manifest-delegation-vectors.mjs \
            --check
          node --test \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/app-build-handoff-test.mjs \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/app-dotenvx-inputs-test.mjs \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/app-worker-deployment-reference-test.mjs \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/app-worker-endpoint-mapping-test.mjs \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/runtime-config-bootstrap-trust-test.mjs \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/tlsn-runtime-config-manifest-test.mjs \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/tlsn-runtime-config-r2-store-test.mjs \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/tlsn-runtime-config-publisher-readiness-test.mjs

  rust-tlsn-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Verify APP Cargo.lock is committed and not ignored
        shell: bash
        run: |
          set -euo pipefail
          lockfile=packages/FUSOU-APP/src-tauri/Cargo.lock
          git ls-files --error-unmatch -- "$lockfile"
          if git check-ignore --quiet --no-index -- "$lockfile"; then
            echo "APP Cargo.lock is still ignored" >&2
            exit 1
          else
            status=$?
            if [[ "$status" -ne 1 ]]; then
              exit "$status"
            fi
          fi

      - name: Test APP TLSN preflight with the locked dependency graph
        run: >-
          cargo test --locked
          --manifest-path packages/FUSOU-APP/src-tauri/Cargo.toml
          --features tlsn-production
          tlsn_preflight --lib

      - name: Test exact Worker health snapshot capture
        run: >-
          cargo test --locked
          --manifest-path packages/FUSOU-APP/src-tauri/Cargo.toml
          --features tlsn-production
          tlsn_runtime --lib

  proxy-capture-source-unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Verify Proxy Cargo.lock is committed and not ignored
        shell: bash
        run: |
          set -euo pipefail
          lockfile=packages/FUSOU-PROXY/proxy-https/Cargo.lock
          git ls-files --error-unmatch -- "$lockfile"
          if git check-ignore --quiet --no-index -- "$lockfile"; then
            echo "Proxy Cargo.lock is still ignored" >&2
            exit 1
          else
            status=$?
            if [[ "$status" -ne 1 ]]; then
              exit "$status"
            fi
          fi

      - name: Fetch locked Proxy package dependencies
        run: >-
          cargo +1.98.1 fetch --locked
          --manifest-path packages/FUSOU-PROXY/proxy-https/Cargo.toml
        env:
          CARGO_NET_OFFLINE: "false"
          RUSTUP_TOOLCHAIN: "1.98.1"
          RUSTUP_AUTO_INSTALL: "0"

      - name: Fetch locked isolated capture harness dependencies
        run: >-
          cargo +1.98.1 fetch --locked
          --manifest-path packages/FUSOU-PROXY/proxy-https/capture-test-harness/Cargo.toml
        env:
          CARGO_NET_OFFLINE: "false"
          RUSTUP_TOOLCHAIN: "1.98.1"
          RUSTUP_AUTO_INSTALL: "0"

      - name: Type-check Proxy capture and lifecycle source modules
        run: >-
          cargo +1.98.1 check --locked --offline --lib
          --manifest-path packages/FUSOU-PROXY/proxy-https/capture-test-harness/Cargo.toml
        env:
          CARGO_NET_OFFLINE: "true"
          CARGO_TARGET_DIR: ${{ runner.temp }}/fusou-proxy-capture-harness-target
          RUSTUP_TOOLCHAIN: "1.98.1"
          RUSTUP_AUTO_INSTALL: "0"

      - name: Run Proxy capture and lifecycle unit tests
        run: >-
          cargo +1.98.1 test --locked --offline --lib
          --manifest-path packages/FUSOU-PROXY/proxy-https/capture-test-harness/Cargo.toml
        env:
          CARGO_NET_OFFLINE: "true"
          CARGO_TARGET_DIR: ${{ runner.temp }}/fusou-proxy-capture-harness-target
          RUSTUP_TOOLCHAIN: "1.98.1"
          RUSTUP_AUTO_INSTALL: "0"

      - name: Fetch locked Proxy health evidence test dependencies
        run: >-
          cargo +1.98.1 fetch --locked
          --manifest-path packages/FUSOU-PROXY/proxy-https/Cargo.toml
        env:
          CARGO_NET_OFFLINE: "false"
          RUSTUP_TOOLCHAIN: "1.98.1"
          RUSTUP_AUTO_INSTALL: "0"

      - name: Run Proxy health snapshot and candidate artifact tests
        run: >-
          cargo +1.98.1 test --locked --offline --lib --features alpha15-tlsn
          --manifest-path packages/FUSOU-PROXY/proxy-https/Cargo.toml
          health
        env:
          CARGO_NET_OFFLINE: "true"
          CARGO_TARGET_DIR: ${{ runner.temp }}/fusou-proxy-health-target
          RUSTUP_TOOLCHAIN: "1.98.1"
          RUSTUP_AUTO_INSTALL: "0"
