name: TLSN testplay candidate checks

on:
  push:
    branches:
      - tlsn-first-testplay-candidate
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-contract-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Install wasm32-unknown-unknown target
        run: rustup target add --toolchain 1.98.1 wasm32-unknown-unknown

      - name: Verify and expose pinned wasm-pack for Worker
        shell: bash
        run: |
          set -euo pipefail
          wasm_pack_dir="$GITHUB_WORKSPACE/packages/avro-wasm/node_modules/.bin"
          test -x "$wasm_pack_dir/wasm-pack"
          version="$(pnpm --dir packages/avro-wasm exec wasm-pack --version)"
          echo "Using ${version}"
          test "${version}" = "wasm-pack 0.15.0"
          printf '%s\n' "$wasm_pack_dir" >> "$GITHUB_PATH"
          export PATH="$wasm_pack_dir:$PATH"
          resolved="$(
            node --input-type=module -e '
              import { resolveWasmPackCommand } from "./packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/wasm-provenance.mjs";
              import { resolve } from "node:path";
              console.log(resolveWasmPackCommand(resolve("packages/FUSOU-TLSN-VERIFICATION-WORKER")));
            '
          )"
          if [[ "$resolved" == "wasm-pack" ]]; then
            resolved="$(command -v wasm-pack)"
          fi
          resolved_version="$("$resolved" --version)"
          echo "Worker build resolves ${resolved} (${resolved_version})"
          test "${resolved_version}" = "wasm-pack 0.15.0"

      - name: Build avro-wasm for WEB typecheck
        run: pnpm --dir packages/avro-wasm run build

      - name: Verify generated avro-wasm module
        run: test -s packages/avro-wasm/pkg/avro_wasm.js

      - name: Verify APP Cargo.lock is committed and not ignored
        shell: bash
        run: |
          set -euo pipefail
          lockfile=packages/FUSOU-APP/src-tauri/Cargo.lock
          git ls-files --error-unmatch -- "$lockfile"
          if git check-ignore --quiet --no-index -- "$lockfile"; then
            echo "APP Cargo.lock is still ignored" >&2
            exit 1
          else
            status=$?
            if [[ "$status" -ne 1 ]]; then
              exit "$status"
            fi
          fi

      - name: Run APP clean-capture tests
        run: pnpm --dir packages/FUSOU-APP run test:clean-capture

      - name: Install isolated proof test database tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16

      - name: Verify owner proof handlers and atomic database consumption
        working-directory: packages/FUSOU-WEB
        run: |
          pnpm exec tsc --noEmit --pretty false
          pnpm exec vitest run \
            src/server/routes/__tests__/tlsn-device-proof.integration.test.ts \
            src/server/routes/__tests__/anonymous-sync-v2-endpoints.test.ts \
            src/server/routes/__tests__/anonymous-sync-v2.test.ts \
            src/server/schemas/__tests__/anonymous-sync-v2.test.ts

      - name: Install pinned wasm-compatible Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18=1:18.1.3-1ubuntu1

      - name: Install pinned wasm-bindgen and Binaryen
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: "1.98.1"
          RUSTUP_AUTO_INSTALL: "0"
        run: |
          set -euo pipefail
          cargo +1.98.1 install wasm-bindgen-cli --version 0.2.128 --locked \
            --root "$RUNNER_TEMP/wasm-bindgen-cli"
          printf '%s\n' "$RUNNER_TEMP/wasm-bindgen-cli/bin" >> "$GITHUB_PATH"

          wasm_opt_archive="$RUNNER_TEMP/binaryen-version_133-x86_64-linux.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz \
            --output "$wasm_opt_archive"
          printf '%s  %s\n' \
            2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489 \
            "$wasm_opt_archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/binaryen-133"
          tar -xzf "$wasm_opt_archive" --directory "$RUNNER_TEMP/binaryen-133" --strip-components=1
          printf '%s\n' "$RUNNER_TEMP/binaryen-133/bin" >> "$GITHUB_PATH"

      - name: Verify Worker WASM toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc +1.98.1 --version
          rustup target list --installed --toolchain 1.98.1 | grep -Fxq wasm32-unknown-unknown
          test "$(wasm-bindgen --version)" = "wasm-bindgen 0.2.128"
          test "$(wasm-opt --version)" = "wasm-opt version 133 (version_133)"
          test "$(clang-18 --version | sed -n '1p')" = "Ubuntu clang version 18.1.3 (1ubuntu1)"

      - name: Fetch locked Worker WASM dependencies
        run: cargo +1.98.1 fetch --locked --manifest-path packages/FUSOU-TLSN-VERIFIER/Cargo.toml
        env:
          CARGO_NET_OFFLINE: "false"
          RUSTUP_TOOLCHAIN: "1.98.1"
          RUSTUP_AUTO_INSTALL: "0"

      - name: Build Worker verifier WASM with commit-bound offline provenance
        run: pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run build:wasm
        env:
          FUSOU_RELEASE_ALLOW_WASM_BUILD: "1"
          FUSOU_RELEASE_SOURCE_SHA: ${{ github.sha }}
          RUSTUP_TOOLCHAIN: "1.98.1"
          CARGO_NET_OFFLINE: "true"
          RUSTUP_AUTO_INSTALL: "0"
          CC_wasm32_unknown_unknown: clang-18

      - name: Verify all generated Worker WASM artifacts exist
        shell: bash
        run: |
          set -euo pipefail
          for artifact in \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/src/wasm/fusou_tlsn_verifier.js \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/src/wasm/fusou_tlsn_verifier.d.ts \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/src/wasm/fusou_tlsn_verifier_bg.wasm \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/src/wasm/fusou_tlsn_verifier_bg.wasm.d.ts \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/src/wasm/wasm-provenance.json; do
            test -s "$artifact"
          done

      - name: Verify Worker WASM provenance
        run: pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run verify:wasm-provenance
        env:
          FUSOU_RELEASE_ALLOW_WASM_BUILD: "1"
          FUSOU_RELEASE_SOURCE_SHA: ${{ github.sha }}
          RUSTUP_TOOLCHAIN: "1.98.1"
          CARGO_NET_OFFLINE: "true"
          RUSTUP_AUTO_INSTALL: "0"
          CC_wasm32_unknown_unknown: clang-18

      - name: Verify bounded Worker proof clients
        run: |
          pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run typecheck
          node --experimental-strip-types --test \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/device-proof-client.test.mjs \
            scripts/release-worker-source.test.mjs \
            scripts/release-worker-integration.test.mjs

      - name: Run APP build handoff and Worker reference tests
        run: |
          node --test \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/app-build-handoff-test.mjs \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/app-dotenvx-inputs-test.mjs \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/app-worker-deployment-reference-test.mjs \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/app-worker-endpoint-mapping-test.mjs

  rust-tlsn-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Verify APP Cargo.lock is committed and not ignored
        shell: bash
        run: |
          set -euo pipefail
          lockfile=packages/FUSOU-APP/src-tauri/Cargo.lock
          git ls-files --error-unmatch -- "$lockfile"
          if git check-ignore --quiet --no-index -- "$lockfile"; then
            echo "APP Cargo.lock is still ignored" >&2
            exit 1
          else
            status=$?
            if [[ "$status" -ne 1 ]]; then
              exit "$status"
            fi
          fi

      - name: Test APP TLSN preflight with the locked dependency graph
        run: >-
          cargo test --locked
          --manifest-path packages/FUSOU-APP/src-tauri/Cargo.toml
          --features tlsn-production
          tlsn_preflight --lib
