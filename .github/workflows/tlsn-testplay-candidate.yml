name: TLSN testplay candidate checks

on:
  push:
    branches:
      - tlsn-first-testplay-candidate
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-contract-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Chromium for APP readiness interaction test
        run: pnpm --dir packages/FUSOU-APP exec playwright install --with-deps chromium

      - name: Verify APP TLSN readiness browser regression
        run: >-
          pnpm --dir packages/FUSOU-APP exec vitest run
          --config vitest.readiness.config.ts

      - name: Verify mocked Linux PAC settings transactions
        run: bash packages/FUSOU-APP/scripts/test-pac-settings.sh

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Install wasm32-unknown-unknown target
        run: rustup target add --toolchain 1.98.1 wasm32-unknown-unknown

      - name: Cache pinned wasm-pack release archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/wasm-pack-download
          key: wasm-pack-Linux-X64-0.15.1-410101009739b9d01c7d5affaaad6e9c9a24b4cba6791a4805db8e89b9bf7af2

      - name: Install and verify official wasm-pack 0.15.1
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          # Pin the official release and digest; never resolve "latest" during CI.
          version=0.15.1
          target=x86_64-unknown-linux-musl
          digest=410101009739b9d01c7d5affaaad6e9c9a24b4cba6791a4805db8e89b9bf7af2
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          archive_dir="$RUNNER_TEMP/wasm-pack-download"
          wasm_pack_dir="$RUNNER_TEMP/wasm-pack-$version/bin"
          mkdir -p "$archive_dir" "$wasm_pack_dir"
          archive="$archive_dir/wasm-pack-v$version-$target.tar.gz"
          # Download to a temporary file so a failed transfer cannot become a cache hit.
          if [[ ! -f "$archive" ]]; then
            partial="$(mktemp "$archive_dir/download.XXXXXX")"
            trap 'rm -f "$partial"' EXIT
            curl --fail --location --silent --show-error \
              --proto '=https' --proto-redir '=https' \
              --connect-timeout 10 --max-time 45 \
              --retry 4 --retry-max-time 180 --retry-connrefused \
              "https://github.com/wasm-bindgen/wasm-pack/releases/download/v$version/wasm-pack-v$version-$target.tar.gz" \
              --output "$partial"
            printf '%s  %s\n' "$digest" "$partial" | sha256sum --check
            mv "$partial" "$archive"
            trap - EXIT
          fi
          # Validate cache hits too, before extracting or executing any binary.
          printf '%s  %s\n' "$digest" "$archive" | sha256sum --check
          tar -xzf "$archive" --directory "$wasm_pack_dir" --strip-components=1 \
            "wasm-pack-v$version-$target/wasm-pack"
          chmod 755 "$wasm_pack_dir/wasm-pack"
          test "$("$wasm_pack_dir/wasm-pack" --version)" = "wasm-pack $version"
          printf '%s\n' "$wasm_pack_dir" >> "$GITHUB_PATH"
          export PATH="$wasm_pack_dir:$PATH"
          # pnpm prepends this directory. Replace its lazy-download shim with the
          # verified executable so avro and Worker builds use the same release.
          ln -sf "$wasm_pack_dir/wasm-pack" \
            "$GITHUB_WORKSPACE/packages/avro-wasm/node_modules/.bin/wasm-pack"
          test "$(pnpm --dir packages/avro-wasm exec wasm-pack --version)" = "wasm-pack $version"
          resolved="$(
            node --input-type=module -e '
              import { resolveWasmPackCommand } from "./packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/wasm-provenance.mjs";
              import { resolve } from "node:path";
              console.log(resolveWasmPackCommand(resolve("packages/FUSOU-TLSN-VERIFICATION-WORKER")));
            '
          )"
          if [[ "$resolved" == "wasm-pack" ]]; then
            resolved="$(command -v wasm-pack)"
          fi
          test "$(readlink -f "$resolved")" = "$wasm_pack_dir/wasm-pack"
          resolved_version="$("$resolved" --version)"
          echo "Worker build resolves ${resolved} (${resolved_version})"
          test "${resolved_version}" = "wasm-pack $version"

      - name: Build avro-wasm for WEB typecheck
        run: pnpm --dir packages/avro-wasm run build

      - name: Verify generated avro-wasm module
        run: test -s packages/avro-wasm/pkg/avro_wasm.js

      - name: Verify APP Cargo.lock is committed and not ignored
        shell: bash
        run: |
          set -euo pipefail
          lockfile=packages/FUSOU-APP/src-tauri/Cargo.lock
          git ls-files --error-unmatch -- "$lockfile"
          if git check-ignore --quiet --no-index -- "$lockfile"; then
            echo "APP Cargo.lock is still ignored" >&2
            exit 1
          else
            status=$?
            if [[ "$status" -ne 1 ]]; then
              exit "$status"
            fi
          fi

      - name: Run APP clean-capture tests
        run: pnpm --dir packages/FUSOU-APP run test:clean-capture

      - name: Fetch locked APP Rust verifier dependencies
        run: cargo +1.98.1 fetch --locked --manifest-path packages/FUSOU-APP/src-tauri/Cargo.toml
        env:
          CARGO_NET_OFFLINE: "false"
          RUSTUP_TOOLCHAIN: "1.98.1"
          RUSTUP_AUTO_INSTALL: "0"

      - name: Install isolated proof test database tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16

      - name: Verify owner proof handlers and atomic database consumption
        working-directory: packages/FUSOU-WEB
        run: |
          pnpm exec tsc --noEmit --pretty false
          pnpm exec vitest run \
            src/server/routes/__tests__/tlsn-device-proof.integration.test.ts \
            src/server/routes/__tests__/anonymous-sync-v2-endpoints.test.ts \
            src/server/routes/__tests__/anonymous-sync-v2.test.ts \
            src/server/schemas/__tests__/anonymous-sync-v2.test.ts
          node --test scripts/tlsn-testplay-build-profile.test.mjs

      - name: Install pinned wasm-compatible Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18=1:18.1.3-1ubuntu1

      - name: Install pinned wasm-bindgen and Binaryen
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: "1.98.1"
          RUSTUP_AUTO_INSTALL: "0"
        run: |
          set -euo pipefail
          cargo +1.98.1 install wasm-bindgen-cli --version 0.2.128 --locked \
            --root "$RUNNER_TEMP/wasm-bindgen-cli"
          printf '%s\n' "$RUNNER_TEMP/wasm-bindgen-cli/bin" >> "$GITHUB_PATH"

          wasm_opt_archive="$RUNNER_TEMP/binaryen-version_133-x86_64-linux.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz \
            --output "$wasm_opt_archive"
          printf '%s  %s\n' \
            2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489 \
            "$wasm_opt_archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/binaryen-133"
          tar -xzf "$wasm_opt_archive" --directory "$RUNNER_TEMP/binaryen-133" --strip-components=1
          printf '%s\n' "$RUNNER_TEMP/binaryen-133/bin" >> "$GITHUB_PATH"

      - name: Verify Worker WASM toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc +1.98.1 --version
          rustup target list --installed --toolchain 1.98.1 | grep -Fxq wasm32-unknown-unknown
          test "$(wasm-bindgen --version)" = "wasm-bindgen 0.2.128"
          test "$(wasm-opt --version)" = "wasm-opt version 133 (version_133)"
          test "$(clang-18 --version | sed -n '1p')" = "Ubuntu clang version 18.1.3 (1ubuntu1)"

      - name: Fetch locked Worker WASM dependencies
        run: cargo +1.98.1 fetch --locked --manifest-path packages/FUSOU-TLSN-VERIFIER/Cargo.toml
        env:
          CARGO_NET_OFFLINE: "false"
          RUSTUP_TOOLCHAIN: "1.98.1"
          RUSTUP_AUTO_INSTALL: "0"

      - name: Test independent TLSN verifier, CLI, and candidate finalizer
        run: >-
          cargo +1.98.1 test --locked --offline
          --manifest-path packages/FUSOU-TLSN-VERIFIER/Cargo.toml
          --lib
          --bin verify_fusou_tlsn_evidence
        env:
          CARGO_NET_OFFLINE: "true"
          RUSTUP_TOOLCHAIN: "1.98.1"
          RUSTUP_AUTO_INSTALL: "0"

      - name: Build Worker verifier WASM with commit-bound offline provenance
        run: pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run build:wasm
        env:
          FUSOU_RELEASE_ALLOW_WASM_BUILD: "1"
          FUSOU_RELEASE_SOURCE_SHA: ${{ github.sha }}
          RUSTUP_TOOLCHAIN: "1.98.1"
          CARGO_NET_OFFLINE: "true"
          RUSTUP_AUTO_INSTALL: "0"
          CC_wasm32_unknown_unknown: clang-18

      - name: Verify all generated Worker WASM artifacts exist
        shell: bash
        run: |
          set -euo pipefail
          for artifact in \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/src/wasm/fusou_tlsn_verifier.js \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/src/wasm/fusou_tlsn_verifier.d.ts \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/src/wasm/fusou_tlsn_verifier_bg.wasm \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/src/wasm/fusou_tlsn_verifier_bg.wasm.d.ts \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/src/wasm/wasm-provenance.json; do
            test -s "$artifact"
          done

      - name: Verify Worker WASM provenance
        run: pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run verify:wasm-provenance
        env:
          FUSOU_RELEASE_ALLOW_WASM_BUILD: "1"
          FUSOU_RELEASE_SOURCE_SHA: ${{ github.sha }}
          RUSTUP_TOOLCHAIN: "1.98.1"
          CARGO_NET_OFFLINE: "true"
          RUSTUP_AUTO_INSTALL: "0"
          CC_wasm32_unknown_unknown: clang-18

      - name: Verify bounded Worker proof clients and replay collection
        run: |
          pnpm --dir packages/FUSOU-TLSN-VERIFICATION-WORKER run typecheck
          node --experimental-strip-types --test \
            packages/FUSOU-TLSN-VERIFIER/scripts/collect-replay-observation.test.mjs \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/device-proof-client.test.mjs \
            scripts/release-worker-source.test.mjs \
            scripts/release-worker-integration.test.mjs

      - name: Install APP Rust integration build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Test Freshness, Production Result, and candidate readiness contracts
        run: |
          pnpm --dir packages/FUSOU-TLSN-RUNTIME-CONFIG-DOMAIN run typecheck
          pnpm --dir packages/FUSOU-TLSN-RUNTIME-CONFIG-DOMAIN run test
          pnpm --dir packages/FUSOU-TLSN-RUNTIME-CONFIG-FRESHNESS-GATEWAY run typecheck
          pnpm --dir packages/FUSOU-TLSN-RUNTIME-CONFIG-FRESHNESS-GATEWAY run test:runtime
          pnpm --dir packages/FUSOU-TLSN-RUNTIME-CONFIG-FRESHNESS-COORDINATOR run typecheck
          pnpm --dir packages/FUSOU-TLSN-RUNTIME-CONFIG-FRESHNESS-COORDINATOR run test:runtime
          node --experimental-strip-types --test \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/tlsn-runtime-config-freshness-test.mjs \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/session-context-grant-contract-test.mjs \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/production-result-contract.test.mjs \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/production-evidence-contract.test.mjs \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/production-evidence-trust-graph-test.mjs \
            packages/FUSOU-APP/scripts/testplay-acceptance-stages.test.mjs \
            packages/FUSOU-APP/scripts/testplay-pre-capture-readiness.test.mjs

      - name: Verify Production Queue execution receipt contract
        run: |
          node --experimental-transform-types --test \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/production-queue-receipt.test.mjs

      - name: Verify isolated Manifest harness Cargo.lock is committed and not ignored
        shell: bash
        run: |
          set -euo pipefail
          lockfile=packages/FUSOU-APP/src-tauri/manifest-verification-harness/Cargo.lock
          test -f "$lockfile"
          git ls-files --error-unmatch -- "$lockfile"
          if git check-ignore --quiet --no-index -- "$lockfile"; then
            echo "Manifest harness Cargo.lock is still ignored" >&2
            exit 1
          else
            status=$?
            if [[ "$status" -ne 1 ]]; then
              exit "$status"
            fi
          fi

      - name: Fetch locked isolated APP-source Manifest harness dependencies
        run: >-
          cargo +1.98.1 fetch --locked
          --manifest-path packages/FUSOU-APP/src-tauri/manifest-verification-harness/Cargo.toml
        env:
          CARGO_NET_OFFLINE: "false"
          RUSTUP_TOOLCHAIN: "1.98.1"
          RUSTUP_AUTO_INSTALL: "0"

      - name: Run isolated APP-source Manifest verification suite
        run: >-
          cargo +1.98.1 test --locked --offline --all-targets
          --manifest-path packages/FUSOU-APP/src-tauri/manifest-verification-harness/Cargo.toml
        env:
          CARGO_NET_OFFLINE: "true"
          CARGO_TARGET_DIR: ${{ runner.temp }}/fusou-manifest-verification-harness-target
          RUSTUP_TOOLCHAIN: "1.98.1"
          RUSTUP_AUTO_INSTALL: "0"

      - name: Run APP build handoff and Worker reference tests
        run: |
          node --experimental-strip-types \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/generate-runtime-config-manifest-delegation-vectors.mjs \
            --check
          node --test \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/app-build-handoff-test.mjs \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/app-dotenvx-inputs-test.mjs \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/app-worker-deployment-reference-test.mjs \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/app-worker-endpoint-mapping-test.mjs \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/runtime-config-bootstrap-trust-test.mjs \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/tlsn-runtime-config-manifest-test.mjs \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/notary-operational-preflight.test.mjs \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/tlsn-runtime-config-r2-store-test.mjs \
            packages/FUSOU-TLSN-VERIFICATION-WORKER/scripts/tlsn-runtime-config-publisher-readiness-test.mjs

  rust-tlsn-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Verify APP Cargo.lock is committed and not ignored
        shell: bash
        run: |
          set -euo pipefail
          lockfile=packages/FUSOU-APP/src-tauri/Cargo.lock
          git ls-files --error-unmatch -- "$lockfile"
          if git check-ignore --quiet --no-index -- "$lockfile"; then
            echo "APP Cargo.lock is still ignored" >&2
            exit 1
          else
            status=$?
            if [[ "$status" -ne 1 ]]; then
              exit "$status"
            fi
          fi

      - name: Test APP TLSN preflight with the locked dependency graph
        run: >-
          cargo test --locked
          --manifest-path packages/FUSOU-APP/src-tauri/Cargo.toml
          --features tlsn-production
          tlsn_preflight --lib

      - name: Test exact Worker health snapshot capture
        run: >-
          cargo test --locked
          --manifest-path packages/FUSOU-APP/src-tauri/Cargo.toml
          --features tlsn-production
          tlsn_runtime --lib

  proxy-capture-source-unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Verify Proxy Cargo.lock is committed and not ignored
        shell: bash
        run: |
          set -euo pipefail
          lockfile=packages/FUSOU-PROXY/proxy-https/Cargo.lock
          git ls-files --error-unmatch -- "$lockfile"
          if git check-ignore --quiet --no-index -- "$lockfile"; then
            echo "Proxy Cargo.lock is still ignored" >&2
            exit 1
          else
            status=$?
            if [[ "$status" -ne 1 ]]; then
              exit "$status"
            fi
          fi

      - name: Fetch locked Proxy package dependencies
        run: >-
          cargo +1.98.1 fetch --locked
          --manifest-path packages/FUSOU-PROXY/proxy-https/Cargo.toml
        env:
          CARGO_NET_OFFLINE: "false"
          RUSTUP_TOOLCHAIN: "1.98.1"
          RUSTUP_AUTO_INSTALL: "0"

      - name: Fetch locked isolated capture harness dependencies
        run: >-
          cargo +1.98.1 fetch --locked
          --manifest-path packages/FUSOU-PROXY/proxy-https/capture-test-harness/Cargo.toml
        env:
          CARGO_NET_OFFLINE: "false"
          RUSTUP_TOOLCHAIN: "1.98.1"
          RUSTUP_AUTO_INSTALL: "0"

      - name: Type-check Proxy capture and lifecycle source modules
        run: >-
          cargo +1.98.1 check --locked --offline --lib
          --manifest-path packages/FUSOU-PROXY/proxy-https/capture-test-harness/Cargo.toml
        env:
          CARGO_NET_OFFLINE: "true"
          CARGO_TARGET_DIR: ${{ runner.temp }}/fusou-proxy-capture-harness-target
          RUSTUP_TOOLCHAIN: "1.98.1"
          RUSTUP_AUTO_INSTALL: "0"

      - name: Run Proxy capture and lifecycle unit tests
        run: >-
          cargo +1.98.1 test --locked --offline --lib
          --manifest-path packages/FUSOU-PROXY/proxy-https/capture-test-harness/Cargo.toml
        env:
          CARGO_NET_OFFLINE: "true"
          CARGO_TARGET_DIR: ${{ runner.temp }}/fusou-proxy-capture-harness-target
          RUSTUP_TOOLCHAIN: "1.98.1"
          RUSTUP_AUTO_INSTALL: "0"

      - name: Fetch locked Proxy health evidence test dependencies
        run: >-
          cargo +1.98.1 fetch --locked
          --manifest-path packages/FUSOU-PROXY/proxy-https/Cargo.toml
        env:
          CARGO_NET_OFFLINE: "false"
          RUSTUP_TOOLCHAIN: "1.98.1"
          RUSTUP_AUTO_INSTALL: "0"

      - name: Run Proxy health snapshot and candidate artifact tests
        run: >-
          cargo +1.98.1 test --locked --offline --lib --features alpha15-tlsn
          --manifest-path packages/FUSOU-PROXY/proxy-https/Cargo.toml
          health
        env:
          CARGO_NET_OFFLINE: "true"
          CARGO_TARGET_DIR: ${{ runner.temp }}/fusou-proxy-health-target
          RUSTUP_TOOLCHAIN: "1.98.1"
          RUSTUP_AUTO_INSTALL: "0"

      - name: Run required synthetic TLSN, handler, and persistent Notary tests
        shell: bash
        run: |
          set -euo pipefail
          manifest=packages/FUSOU-PROXY/proxy-https/Cargo.toml
          listing="$(
            cargo +1.98.1 test --locked --offline --lib --features synthetic-tlsn \
              --manifest-path "$manifest" -- --list
          )"
          run_exact_test() {
            local test_name="$1"
            local proof_mode="${2:-complete}"
            if ! grep -Fxq "$test_name: test" <<< "$listing"; then
              echo "Required Proxy test was not discovered: $test_name" >&2
              exit 1
            fi
            FUSOU_SYNTHETIC_PROOF_MODE="$proof_mode" \
              cargo +1.98.1 test --locked --offline --lib --features synthetic-tlsn \
                --manifest-path "$manifest" "$test_name" -- --exact
          }

          run_exact_test \
            synthetic_tlsn::tests::synthetic_transport_uses_alpha15_and_preserves_wire_bytes
          run_exact_test \
            synthetic_tlsn::tests::synthetic_transport_uses_alpha15_and_preserves_wire_bytes \
            sparse
          run_exact_test \
            proxy_server_https::tests::reserved_binding_header_is_rejected_before_body_read_or_fallback
          run_exact_test \
            proxy_server_https::tests::headerless_capture_unavailable_fallback_reaches_loopback_origin_once
          run_exact_test \
            proxy_server_https::tests::confirmed_not_sent_capture_fallback_reaches_loopback_origin_once
          run_exact_test \
            proxy_server_https::tests::ambiguous_capture_failure_never_returns_an_ordinary_proxy_request
          run_exact_test \
            proxy_server_https::tests::actual_handler_runs_concrete_alpha15_transport_and_returns_origin_response
          run_exact_test \
            synthetic_notary::tests::durable_notary_claims_once_and_returns_the_exact_saved_result
          run_exact_test \
            synthetic_notary::tests::finalized_parent_directory_sync_failure_blocks_queries_until_durable_reopen
          run_exact_test \
            synthetic_notary::tests::signing_parent_directory_sync_failure_reopens_as_unknown_without_reuse
          run_exact_test \
            synthetic_notary::tests::process_restart_preserves_durable_notary_states_and_exact_result_bytes
          run_exact_test \
            synthetic_notary::tests::missing_store_file_fails_closed_for_all_persisted_states
          run_exact_test \
            synthetic_notary::tests::explicit_store_initialization_rejects_existing_store_without_overwriting
          run_exact_test \
            synthetic_notary::tests::corrupt_unreadable_and_unsupported_stores_fail_closed
          run_exact_test \
            synthetic_notary::tests::concurrent_grant_admission_has_exactly_one_winner
          run_exact_test \
            synthetic_notary::tests::restart_preserves_unknown_and_never_reopens_a_signature_claim
          run_exact_test \
            synthetic_notary::tests::mismatched_or_client_supplied_acceptance_extensions_are_quarantined
          run_exact_test \
            synthetic_notary::tests::another_session_or_device_grant_cannot_be_substituted_on_a_live_connection
          run_exact_test \
            synthetic_notary::tests::another_live_notary_connection_cannot_accept_the_first_connections_grant
          run_exact_test \
            synthetic_notary::tests::wrong_session_authority_pin_is_rejected_at_admission
          run_exact_test \
            synthetic_notary::tests::restart_after_admission_marks_operation_unknown_without_signature
          run_exact_test \
            synthetic_notary::tests::result_query_requires_the_pinned_authority_signature
          run_exact_test \
            experimental_tlsn::tests::prepared_binding_expiry_is_exclusive_at_deadline
          run_exact_test \
            experimental_tlsn::tests::prepared_binding_issue_rechecks_expiry_after_readiness
          run_exact_test \
            experimental_tlsn::tests::prepared_binding_expiry_does_not_release_an_in_use_capture
          run_exact_test \
            experimental_tlsn::tests::expired_prepared_binding_falls_back_before_transport_send
          run_exact_test \
            experimental_tlsn::tests::expired_binding_cleanup_serializes_concurrent_repreparation
          run_exact_test \
            experimental_tlsn::tests::prepared_binding_keeps_grantless_test_bindings_compatible
          run_exact_test \
            real_tlsn::tests::presentation_handoff_cleanup_is_capture_scoped_for_identical_requests
          run_exact_test \
            real_tlsn::tests::verified_worker_results_are_capture_scoped_through_cancel_and_late_cleanup
          run_exact_test \
            real_tlsn::tests::forwarder_cancellation_after_presentation_publish_cleans_before_verifier
          run_exact_test \
            real_tlsn::tests::forwarder_cancellation_after_worker_result_registration_cleans_before_persistence
          run_exact_test \
            real_tlsn::tests::remote_session_cleanup_preserves_a_replacement_context
          run_exact_test \
            real_tlsn::tests::candidate_bundle_preserves_exact_response_receipt_and_health_without_overwrite
          run_exact_test \
            real_tlsn::tests::queue_enqueue_unconfirmed_requires_exact_error_and_worker_uuid_v4
          run_exact_test \
            real_tlsn::tests::result_binding_tests::remote_backend_recovers_unconfirmed_queue_result_once_and_preserves_exact_candidate_bytes
          run_exact_test \
            real_tlsn::tests::result_binding_tests::remote_backend_persists_queue_receipt_for_independent_verification
          run_exact_test \
            real_tlsn::tests::result_binding_tests::remote_backend_preserves_accepted_202_and_synchronous_success
          run_exact_test \
            real_tlsn::tests::result_binding_tests::remote_backend_does_not_poll_other_503_responses_or_retry_initial_timeouts
          run_exact_test \
            real_tlsn::tests::result_binding_tests::remote_backend_rejects_mismatched_jobs_unverified_results_and_invalid_signatures_or_bindings
        env:
          CARGO_NET_OFFLINE: "true"
          CARGO_TARGET_DIR: ${{ runner.temp }}/fusou-proxy-health-target
          RUSTUP_TOOLCHAIN: "1.98.1"
          RUSTUP_AUTO_INSTALL: "0"

      - name: Run Notary MPC configuration preflight policy tests
        shell: bash
        run: |
          set -euo pipefail
          manifest=packages/FUSOU-PROXY/proxy-https/Cargo.toml
          features=operational-notary
          listing="$(
            cargo +1.98.1 test --locked --offline --lib --features "$features" \
              --manifest-path "$manifest" -- --list
          )"
          required_tests=(
            notary_server::tests::notary_mpc_config_accepts_proxy_defaults_at_exact_byte_limits
            notary_server::tests::notary_mpc_config_rejects_byte_limits_above_capacity
            notary_server::tests::notary_mpc_config_rejects_online_decryption_above_proxy_default
            notary_server::tests::notary_mpc_config_rejects_explicit_record_limits
            notary_server::tests::notary_mpc_config_rejects_unsupported_decryption_and_network_options
          )
          for test_name in "${required_tests[@]}"; do
            if ! grep -Fxq "$test_name: test" <<< "$listing"; then
              echo "Required Notary MPC policy test was not discovered: $test_name" >&2
              exit 1
            fi
            cargo +1.98.1 test --locked --offline --lib --features "$features" \
              --manifest-path "$manifest" "$test_name" -- --exact --test-threads=1
          done
        env:
          CARGO_NET_OFFLINE: "true"
          CARGO_TARGET_DIR: ${{ runner.temp }}/fusou-proxy-health-target
          RUSTUP_TOOLCHAIN: "1.98.1"
          RUSTUP_AUTO_INSTALL: "0"

      - name: Run separate-process loopback Notary integration
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          manifest=packages/FUSOU-PROXY/proxy-https/Cargo.toml
          features=local-test-notary-fault-injection
          listing="$(
            cargo +1.98.1 test --locked --offline --features "$features" \
              --manifest-path "$manifest" --test local_notary_interop -- --list
          )"
          required_tests=(
            concurrent_same_grant_admission_has_one_origin_send_and_one_final_result
            finalized_parent_directory_sync_failure_hides_result_until_same_ledger_reopens
            foreign_live_grant_and_client_acceptance_are_rejected_after_one_origin_send
            interrupted_admission_and_signing_claim_restart_as_unknown_without_retry
            missing_and_corrupt_existing_store_do_not_start_as_empty_notary
            notary_rejects_unsupported_mpc_config_before_setup_without_publishing_result
            separate_notary_completes_complete_and_sparse_roundtrips_and_replays_exact_results
            shared_transport_isolates_identical_request_bytes_by_capture_binding
            wrong_authority_signature_expiry_and_notary_pin_never_send_origin_http
          )
          discovered="$(awk '/: test$/ { count++ } END { print count + 0 }' <<< "$listing")"
          if [[ "$discovered" -ne "${#required_tests[@]}" ]]; then
            echo "Expected ${#required_tests[@]} Notary interop tests, discovered $discovered" >&2
            exit 1
          fi
          for test_name in "${required_tests[@]}"; do
            if ! grep -Fxq "$test_name: test" <<< "$listing"; then
              echo "Required Notary interop test was not discovered: $test_name" >&2
              exit 1
            fi
            cargo +1.98.1 test --locked --offline --features "$features" \
              --manifest-path "$manifest" --test local_notary_interop "$test_name" \
              -- --exact --test-threads=1
          done
        env:
          CARGO_NET_OFFLINE: "true"
          CARGO_TARGET_DIR: ${{ runner.temp }}/fusou-proxy-health-target
          RUSTUP_TOOLCHAIN: "1.98.1"
          RUSTUP_AUTO_INSTALL: "0"

      - name: Build and verify the normal Notary release candidate
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          manifest=packages/FUSOU-PROXY/proxy-https/Cargo.toml
          binary="$RUNNER_TEMP/fusou-notary-release-target/release/fusou-notary"
          CARGO_TARGET_DIR="$RUNNER_TEMP/fusou-notary-release-target" \
            cargo +1.98.1 build --release --locked --offline \
              --manifest-path "$manifest" --features operational-notary --bin fusou-notary
          sha256sum "$binary" > "$RUNNER_TEMP/fusou-notary.sha256"
          export FUSOU_OPERATIONAL_NOTARY_BIN="$binary"
          features=local-test-notary-fault-injection,operational-notary
          test_names=(
            operational::normal_binary_complete_and_restarts_using_the_same_ledger
            operational::normal_binary_rejects_invalid_loopback_settings_before_side_effects
          )
          listing="$(
            cargo +1.98.1 test --locked --offline --features "$features" \
              --manifest-path "$manifest" --test local_notary_interop -- --list
          )"
          for test_name in "${test_names[@]}"; do
            grep -Fxq "$test_name: test" <<< "$listing"
            cargo +1.98.1 test --locked --offline --features "$features" \
              --manifest-path "$manifest" --test local_notary_interop "$test_name" \
              -- --exact --test-threads=1
          done
          sha256sum --check "$RUNNER_TEMP/fusou-notary.sha256"
        env:
          CARGO_NET_OFFLINE: "true"
          CARGO_TARGET_DIR: ${{ runner.temp }}/fusou-proxy-health-target
          RUSTUP_TOOLCHAIN: "1.98.1"
          RUSTUP_AUTO_INSTALL: "0"

  linux-verification-app-artifact:
    name: Linux verification APP artifact
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/tlsn-first-testplay-candidate'
    needs:
      - node-contract-tests
      - rust-tlsn-preflight
      - proxy-capture-source-unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
      RUSTUP_AUTO_INSTALL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Initialize isolated Cargo target directory
        shell: bash
        run: |
          set -euo pipefail
          target_dir="$RUNNER_TEMP/fusou-linux-verification-app-target"
          mkdir -p "$target_dir"
          printf 'CARGO_TARGET_DIR=%s\n' "$target_dir" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Install Linux Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify the checkout and pinned toolchains
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git ls-files --error-unmatch packages/FUSOU-APP/src-tauri/Cargo.lock
          test "$(rustc --version | cut -d' ' -f2)" = "1.98.1"
          test "$(node --version)" = "v22.16.0"
          test "$(pnpm --version)" = "10.14.0"

      - name: Fetch APP dependencies from the committed lockfile
        run: >-
          cargo +1.98.1 fetch --locked
          --manifest-path packages/FUSOU-APP/src-tauri/Cargo.toml
          --target x86_64-unknown-linux-gnu
        env:
          CARGO_NET_OFFLINE: "false"

      - name: Build frontend without repository dotenv files
        working-directory: packages/FUSOU-APP
        env:
          FUSOU_APP_VITE_ENV_DIR: ${{ runner.temp }}/fusou-empty-vite-env
        run: |
          set -euo pipefail
          mkdir -p "$FUSOU_APP_VITE_ENV_DIR"
          if find "$FUSOU_APP_VITE_ENV_DIR" -mindepth 1 -maxdepth 1 -print -quit | grep -q .; then
            echo "Vite env directory must be empty" >&2
            exit 1
          fi
          pnpm exec vite build --mode production
          test -s dist/index.html

      - name: Build the unsigned, verification-only Debian package
        working-directory: packages/FUSOU-APP
        run: >-
          pnpm exec tauri build
          --target x86_64-unknown-linux-gnu
          --features tlsn-production,custom-protocol
          --bundles deb
          --config src-tauri/tauri.verification-linux.conf.json
          --no-sign
          --ci
          --
          --locked
        env:
          CARGO_NET_OFFLINE: "true"
          FUSOU_APP_BUILD_SOURCE_SHA: ${{ github.sha }}

      - name: Verify and describe the packaged APP
        shell: bash
        run: |
          set -euo pipefail
          deb_dir="$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/bundle/deb"
          mapfile -t packages < <(find "$deb_dir" -maxdepth 1 -type f -name '*.deb' -print)
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "Expected exactly one verification Debian package, found ${#packages[@]}" >&2
            exit 1
          fi

          package_root="$RUNNER_TEMP/fusou-linux-verification-extract"
          mkdir -p "$package_root"
          dpkg-deb --extract "${packages[0]}" "$package_root"

          resource_dir="$package_root/usr/lib/fusou/resources"
          test -x "$package_root/usr/bin/fusou"
          for script in add_proxy.sh delete_proxy.sh add_store.sh check_ca.sh; do
            test -x "$resource_dir/cmd/linux/$script"
          done
          test -r "$resource_dir/cmd/linux/pac_settings_common.sh"
          test -r "$resource_dir/pac/proxy_auto.pac"
          test -r "$resource_dir/pac/proxy_local.pac"
          test -r "$resource_dir/user/configs.toml"
          test ! -e "$resource_dir/roaming/user/configs.toml"

          artifact_dir="$RUNNER_TEMP/fusou-linux-verification-artifact"
          mkdir -p "$artifact_dir"
          package_name="$(basename "${packages[0]}")"
          cp "${packages[0]}" "$artifact_dir/$package_name"
          (
            cd "$artifact_dir"
            sha256sum "$package_name" > SHA256SUMS
          )

          export FUSOU_ARTIFACT_DIR="$artifact_dir"
          export FUSOU_ARTIFACT_FILE="$package_name"
          export FUSOU_ARTIFACT_NAME="fusou-linux-x86_64-verification-$GITHUB_SHA"
          export FUSOU_FRONTEND_INDEX="$GITHUB_WORKSPACE/packages/FUSOU-APP/dist/index.html"
          node <<'NODE'
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");
          const path = require("node:path");

          const sha256 = (file) =>
            execFileSync("sha256sum", [file], { encoding: "utf8" }).split(/\s+/)[0];
          const osRelease = Object.fromEntries(
            fs.readFileSync("/etc/os-release", "utf8")
              .split("\n")
              .filter((line) => /^[A-Z0-9_]+=/.test(line))
              .map((line) => {
                const separator = line.indexOf("=");
                return [line.slice(0, separator), line.slice(separator + 1).replace(/^"|"$/g, "")];
              }),
          );
          const packagePath = path.join(process.env.FUSOU_ARTIFACT_DIR, process.env.FUSOU_ARTIFACT_FILE);
          const manifest = {
            format: "fusou-linux-verification-app-v1",
            classification: "verification-only; not a release or production acceptance artifact",
            artifactName: process.env.FUSOU_ARTIFACT_NAME,
            sourceSha: execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim(),
            event: process.env.GITHUB_EVENT_NAME,
            ref: process.env.GITHUB_REF,
            runner: {
              image: "ubuntu-24.04",
              os: osRelease.PRETTY_NAME,
            },
            target: "x86_64-unknown-linux-gnu",
            features: {
              defaultFeatures: true,
              default: ["kc-api-epoch-20250627"],
              explicitlyEnabled: ["tlsn-production", "custom-protocol"],
            },
            toolchains: {
              rustc: execFileSync("rustc", ["--version"], { encoding: "utf8" }).trim(),
              cargo: execFileSync("cargo", ["--version"], { encoding: "utf8" }).trim(),
              node: process.version,
              pnpm: execFileSync("pnpm", ["--version"], { encoding: "utf8" }).trim(),
            },
            frontend: {
              mode: "production",
              indexHtmlSha256: sha256(process.env.FUSOU_FRONTEND_INDEX),
              envDir: "empty runner-temp directory; repository dotenv files are not loaded",
            },
            updater: {
              endpoints: [],
              updaterArtifacts: false,
              signing: "disabled",
            },
            tlsnRuntimeConfig: "no Production bootstrap values or secrets supplied",
            package: {
              fileName: process.env.FUSOU_ARTIFACT_FILE,
              bytes: fs.statSync(packagePath).size,
              sha256: sha256(packagePath),
              format: "deb",
            },
          };
          fs.writeFileSync(
            path.join(process.env.FUSOU_ARTIFACT_DIR, "MANIFEST.json"),
            `${JSON.stringify(manifest, null, 2)}\n`,
          );
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: fusou-linux-x86_64-verification-${{ github.sha }}
          path: ${{ runner.temp }}/fusou-linux-verification-artifact/
          if-no-files-found: error
          retention-days: 30
