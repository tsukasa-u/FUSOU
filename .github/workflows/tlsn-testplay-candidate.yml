            notary_server::tests::notary_mpc_config_rejects_byte_limits_above_capacity
            notary_server::tests::notary_mpc_config_rejects_online_decryption_above_proxy_default
            notary_server::tests::notary_mpc_config_rejects_explicit_record_limits
            notary_server::tests::notary_mpc_config_rejects_unsupported_decryption_and_network_options
          )
          for test_name in "${required_tests[@]}"; do
            if ! grep -Fxq "$test_name: test" <<< "$listing"; then
