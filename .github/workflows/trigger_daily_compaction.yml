name: Retired Daily Compaction Trigger

# Daily tier compaction is owned by Trigger.dev (compaction-scheduled).
# The former WEB endpoint sends a different schema to the ingest queue.
on:
  workflow_dispatch:

permissions: {}

jobs:
  retired-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Reject the retired trigger
        run: |
          echo "::error::This trigger is retired. Use the existing Trigger.dev compaction-scheduled schedule."
          exit 1
