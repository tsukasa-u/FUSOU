[package]
name = "authenticity-tlsn"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Experimental TLSNotary Presentation adapter using pinned clean upstream"

[features]
default = []
clean-upstream-spike = [
    "dep:bincode",
    "dep:sha2",
    "dep:thiserror",
    "dep:tlsn",
    "dep:tlsn-attestation",
    "dep:tlsn-core",
]

[dependencies]
authenticity-core = { path = "../authenticity-core" }
bincode = { version = "1.3", optional = true }
sha2 = { version = "0.10", optional = true }
thiserror = { version = "1.0", optional = true }
tlsn = { git = "https://github.com/tlsnotary/tlsn.git", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec", version = "0.1.0-alpha.15", optional = true }
tlsn-attestation = { git = "https://github.com/tlsnotary/tlsn.git", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec", version = "0.1.0-alpha.15", optional = true }
tlsn-core = { git = "https://github.com/tlsnotary/tlsn.git", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec", version = "0.1.0-alpha.15", optional = true }

[dev-dependencies]
rcgen = "0.13"
