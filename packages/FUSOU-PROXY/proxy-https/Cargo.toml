[package]
name = "proxy-https"
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
http-body-util = "0.1.0"
hudsucker = { path = "../hudsucker-fork" }
hyper = "1.5.2"
hyper-rustls = { version = "0.27.0", default-features = false, features = ["ring"] }
regex = "1.10.6"
tokio = { version = "^1.24.2", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync", "time"] }
chrono = "0.4.31"
chrono-tz = "0.10.0"
http = "1.1.0"
rustls-native-certs = "0.8.0"
warp = "0.3.7"
flate2 = "1.0.35"
brotli = "3.5.0"
configs = { path = "./../../configs" }
tracing = "0.1.41"
tracing-unwrap = "1.0.1"
dashmap = "5.5.3"
once_cell = "1.19.0"
walkdir = "2.5.0"
reqwest = { version = "0.12.5", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"
fusou-auth = { path = "../../fusou-auth" }
fusou-upload = { path = "../../fusou-upload" }
fusou-storage = { path = "../../fusou-storage", default-features = false }

# optional grpc feature
tonic = { version = "0.9", optional = true, features = ["transport"] }
prost = { version = "0.11", optional = true }
tokio-stream = { version = "0.1", optional = true, features = ["sync"] }
uuid = { version = "1.18.1", features = ["v4"] }
serde_json = "1.0.145"
bincode = { version = "1.3", optional = true }
sha2 = "0.10"
base64 = { version = "0.22", optional = true }
futures = { version = "0.3.34", optional = true }
fusou-tlsn-verifier = { path = "../../FUSOU-TLSN-VERIFIER", optional = true }
rcgen = { version = "0.13.2", optional = true }
tlsn = { git = "https://github.com/tlsnotary/tlsn.git", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec", version = "0.1.0-alpha.15", optional = true }
tlsn-formats = { git = "https://github.com/tlsnotary/tlsn.git", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec", version = "0.1.0-alpha.15", optional = true }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"], optional = true }
tokio-util = { version = "0.7", optional = true, features = ["compat"] }
ring = { version = "0.17", optional = true }

[build-dependencies]
tonic-build = "0.9"
protoc-bin-vendored = "3"

[features]
# default uses current production epoch feature
default = ["kc-api-epoch-20250627"]
# enable grpc-based channel
grpc = ["tonic", "prost", "tokio-stream"]
alpha15-tlsn = [
	"bincode",
	"base64",
	"futures",
	"fusou-tlsn-verifier",
	"tlsn",
	"tlsn-formats",
	"tokio-rustls",
	"tokio-util",
	"ring",
]
synthetic-tlsn = ["alpha15-tlsn", "rcgen"]
kc-api-epoch-genesis = ["fusou-storage/kc-api-epoch-genesis"]
kc-api-epoch-20250627 = ["fusou-storage/kc-api-epoch-20250627"]

[dev-dependencies]
tracing = { version = "0.1.35", features = ["log"] }
tracing-subscriber = "0.3.8"
rcgen = "0.13.2"
tokio-rustls = "0.26.4"

[[example]]
name = "example"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(TAURI_BUILD_DEBUG)'] }
