name = "fusou-tlsn-testplay-web"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2024-10-22"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
send_metrics = false
routes = [
  { pattern = "tlsn-web.fusou.dev", zone_name = "fusou.dev", custom_domain = true }
]

[assets]
directory = "./dist-tlsn-testplay"
binding = "ASSETS"

[vars]
PUBLIC_SITE_URL = "https://tlsn-web.fusou.dev"
