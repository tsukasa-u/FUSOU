name = "fusou-tlsn-verification"
main = "src/index.ts"
compatibility_date = "2026-09-07"

# Configure these values in Wrangler environments or the Cloudflare dashboard.
# The Worker fails closed when any required value is absent or malformed.
# Production authentication additionally requires TLSN_SUPABASE_URL and
# TLSN_SUPABASE_PUBLISHABLE_KEY. Keep test token fixtures out of production.
# Production device endpoints additionally require
# TLSN_PRODUCTION_DEVICE_AUTH_ALLOWED_HOSTS and the exact FUSOU-WEB API paths.
# Production Supabase token validation additionally requires
# TLSN_PRODUCTION_SUPABASE_ALLOWED_HOSTS.

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[[durable_objects.bindings]]
name = "TLSN_BINDINGS"
class_name = "TlsnBindingAuthorityDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TlsnBindingAuthorityDurableObject"]

[env.test]
name = "fusou-tlsn-verification-test"

[[env.test.durable_objects.bindings]]
name = "TLSN_BINDINGS"
class_name = "TlsnBindingAuthorityDurableObject"

[[env.test.migrations]]
tag = "v1"
new_sqlite_classes = ["TlsnBindingAuthorityDurableObject"]