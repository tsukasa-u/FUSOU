# Resource names are historical references, not verified deployments.
name = "fusou-tlsn-verification"
main = "src/index.ts"
compatibility_date = "2026-09-07"

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[[rules]]
type = "Text"
globs = ["**/tlsn-origin-inventory.json.txt", "**/tlsn-target-approval.json.txt"]
fallthrough = true

[[durable_objects.bindings]]
name = "TLSN_BINDINGS"
class_name = "TlsnBindingAuthorityDurableObject"

[[r2_buckets]]
binding = "TLSN_PRESENTATIONS"
bucket_name = "fusou-tlsn-verification-production"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TlsnBindingAuthorityDurableObject"]

[env.production]
name = "fusou-tlsn-verification-production"

[env.production.version_metadata]
binding = "CF_VERSION_METADATA"

[[env.production.durable_objects.bindings]]
name = "TLSN_BINDINGS"
class_name = "TlsnBindingAuthorityDurableObject"

[[env.production.r2_buckets]]
binding = "TLSN_PRESENTATIONS"
bucket_name = "fusou-tlsn-verification-production"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["TlsnBindingAuthorityDurableObject"]
