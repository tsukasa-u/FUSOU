name = "fusou-tlsn-verification-replay"
main = "src/index.ts"
compatibility_date = "2026-09-07"

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[[durable_objects.bindings]]
name = "TLSN_BINDINGS"
class_name = "TlsnBindingAuthorityDurableObject"

[[r2_buckets]]
binding = "TLSN_PRESENTATIONS"
bucket_name = "fusou-tlsn-verification-replay"

[[services]]
binding = "TLSN_DIRECT_VERIFIER"
service = "fusou-tlsn-verifier-replay"

[[migrations]]
tag = "replay-v1"
new_sqlite_classes = ["TlsnBindingAuthorityDurableObject"]
