[package]
name = "fusou-tlsn-native-launch"
version = "0.1.0"
edition = "2021"
autotests = false
license = "MIT OR Apache-2.0"
description = "Unregistered Linux synthetic FD launch substrate; not a production provider"

[dependencies]
nix = { version = "=0.30.1", default-features = false }

[dev-dependencies]
fusou-tlsn-verifier = { path = ".." }
libc = "=0.2.190"
nix = { version = "=0.30.1", default-features = false, features = ["fs", "poll", "process", "signal", "user"] }
sha2 = "0.10"
serde_json = "1.0.145"
base64 = "0.22"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[[example]]
name = "synthetic_probe"
path = "examples/synthetic_probe.rs"
