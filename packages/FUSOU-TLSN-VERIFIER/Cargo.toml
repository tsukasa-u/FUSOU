[package]
name = "fusou-tlsn-verifier"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Strict parser and frozen TLSNotary alpha.15 adapter for FUSOU require_info evidence"

[dependencies]
base64 = "0.22"
bincode = "1.3"
flate2 = "1.0"
futures = "0.3"
sha2 = "0.10"
tokio = { version = "1.38", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
thiserror = "1.0"
tlsn = { git = "https://github.com/tlsnotary/tlsn.git", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec", version = "0.1.0-alpha.15" }
tlsn-attestation = { git = "https://github.com/tlsnotary/tlsn.git", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec", version = "0.1.0-alpha.15" }
tlsn-core = { git = "https://github.com/tlsnotary/tlsn.git", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec", version = "0.1.0-alpha.15" }
uuid = { version = "1.16", features = ["v4"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
webpki-roots = "1.0.9"

[dev-dependencies]
rcgen = "0.13"
tokio-util = { version = "0.7", features = ["compat"] }

[lints.rust]
unsafe_code = "forbid"
