[package]
name = "fusou-tlsn-verifier"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Strict parser and frozen TLSNotary alpha.15 adapter for FUSOU require_info evidence"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
bincode = "1.3"
flate2 = "1.0"
futures = "0.3"
sha2 = "0.10"
serde_json = "1.0.145"
thiserror = "1.0"
wasm-bindgen = "0.2"
tlsn = { git = "https://github.com/tlsnotary/tlsn.git", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec", version = "0.1.0-alpha.15" }
tlsn-attestation = { git = "https://github.com/tlsnotary/tlsn.git", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec", version = "0.1.0-alpha.15" }
tlsn-core = { git = "https://github.com/tlsnotary/tlsn.git", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec", version = "0.1.0-alpha.15" }
uuid = { version = "1.16", features = ["js", "v4"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
rustls-pki-types = { version = "1.12", features = ["web"] }

[dev-dependencies]
rcgen = "0.13"
tokio = { version = "1.38", features = ["io-util", "macros", "net", "rt-multi-thread"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7", features = ["compat"] }

[lints.rust]
unsafe_code = "forbid"
