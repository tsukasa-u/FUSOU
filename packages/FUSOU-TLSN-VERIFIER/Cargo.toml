[package]
name = "fusou-tlsn-verifier"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Strict parser and frozen TLSNotary alpha.15 adapter for FUSOU require_info evidence"

[dependencies]
base64 = "0.22"
bincode = "1.3"
flate2 = "1.0"
sha2 = "0.10"
thiserror = "1.0"
tlsn-attestation = { git = "https://github.com/tlsnotary/tlsn.git", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec", version = "0.1.0-alpha.15" }
tlsn-core = { git = "https://github.com/tlsnotary/tlsn.git", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec", version = "0.1.0-alpha.15" }
uuid = { version = "1.16", features = ["v4"] }

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"
