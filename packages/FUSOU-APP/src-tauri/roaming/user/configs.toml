# This file is used to configure the FUSOU-PROXY and FUSOU-APP
# By default, the application's features are kept to a minimum. To use restricted features, please change the configuration values.
# Settings marked with "Requires restart to take effect." apply after restarting FUSOU.

# Must match the configs crate version. Configurations without this field are treated as v0.
version = "0.5.1"

[proxy]
# Whether to save KanColle API requests
# Requires restart to take effect.
allow_save_api_requests = true

# Whether to save KanColle API responses
# Requires restart to take effect.
allow_save_api_responses = true

# Whether to save KanColle resources such as images and metadata
# Requires restart to take effect.
allow_save_resources = true

# Whether to save only main.js locally (JS is not uploaded by asset sync)
# Requires restart to take effect.
allow_save_main_js_local = true

# The location to save files
# The default location is under the user's Documents directory
# to use the default location, leave this empty
# Requires restart to take effect.
save_file_location = ""

    [proxy.network]
    # Whether to enforce HTTP to proxy client
    # default is false
    # Requires restart to take effect.
    enforce_http = false

    # Whether to set TCP_NODELAY on the proxy server
    # default is false
    # Requires restart to take effect.
    set_nodelay = false

    # The timeout (in seconds) for connecting to the KanColle server
    # set 0 or negative to use the system default
    # Requires restart to take effect.
    connect_timeout = 0

    # The interval (in seconds) to keep the TCP connection alive
    # set 0 or negative to use the system default
    # Requires restart to take effect.
    keepalive_interval = 0

    # The size of the receive buffer
    # set 0 or negative to use the system default
    # Requires restart to take effect.
    recv_buffer_size = 8_000_000

    # The size of the send buffer
    # set 0 or negative to use the system default
    # Requires restart to take effect.
    send_buffer_size = 8_000_000

    # The fixed port of the proxy server
    # set 0 to use an unused port automatically
    # Requires restart to take effect.
    proxy_server_port = 0


    [proxy.certificates]
    # Whether to use generated certificates
    # default is true
    # Requires restart to take effect.
    use_generated_certs = true

    # The path to the SSL certificate file
    # this option is only used when `use_generated_certs` is false
    # Requires restart to take effect.
    cert_file = "path/to/cert/file"

    # The path to the SSL key file
    # this option is only used when `use_generated_certs` is false
    # Requires restart to take effect.
    key_file = "path/to/key/file"


    [proxy.pac]
    # Whether to use a custom PAC script
    # default is false
    # Requires restart to take effect.
    use_custom_pac = false

    # The path to the PAC script
    # this option is only used when `use_custom_pac` is true
    # Requires restart to take effect.
    pac_script = "path/to/pac/script.pac"

    # The fixed port of the PAC server
    # set 0 to use an unused port automatically
    # Requires restart to take effect.
    pac_server_port = 0


[app]
    [app.connect_kc_server.server_list]
    # Server hostname mappings (automatically used by the application)
    #
    #  No. = server hostname            # server name
       1   = "w01y.kancolle-server.com" # 横須賀鎮守府
       2   = "w02k.kancolle-server.com" # 新呉鎮守府
       3   = "w03s.kancolle-server.com" # 佐世保鎮守府
       4   = "w04m.kancolle-server.com" # 舞鶴鎮守府
       5   = "w05o.kancolle-server.com" # 大湊警備府
       6   = "w06k.kancolle-server.com" # トラック泊地
       7   = "w07l.kancolle-server.com" # リンガ泊地
       8   = "w08r.kancolle-server.com" # ラバウル基地
       9   = "w09s.kancolle-server.com" # ショートランド泊地
      10   = "w10b.kancolle-server.com" # ブイン基地
      11   = "w11t.kancolle-server.com" # タウイタウイ泊地
      12   = "w12p.kancolle-server.com" # パラオ泊地
      13   = "w13b.kancolle-server.com" # ブルネイ泊地
      14   = "w14h.kancolle-server.com" # 単冠湾泊地
      15   = "w15p.kancolle-server.com" # 幌筵泊地
      16   = "w16s.kancolle-server.com" # 宿毛湾泊地
      17   = "w17k.kancolle-server.com" # 鹿屋基地
      18   = "w18i.kancolle-server.com" # 岩川基地
      19   = "w19s.kancolle-server.com" # 佐伯湾泊地
      20   = "w20h.kancolle-server.com" # 柱島泊地

    [app.connect_kc_server]
    # The hostname of the KanColle server you want to connect to
    # This is the hostname or IP address of the server, like w16s.kancolle-server.com
    # The correspondence table of server hostname and server name is in [app.connect_kc_server.server_list]
    # Set KanColle server hostname or empty if you want to choose KanColle server automatically
    # kc_server_name = "w16s.kancolle-server.com" # This is example
    # Requires restart to take effect.
    kc_server_name = "w16s.kancolle-server.com"


    [app.browser]
    # The URL to open first in the browser
    # Requires restart to take effect.
    url = "https://play.games.dmm.com/game/kancolle"

    # The directory used to save external WebView screenshots.
    # Leave empty to use the default path: Pictures/FUSOU/screenshots
    # Examples:
    #   Linux: "/home/yourname/Pictures/FUSOU/custom-screenshots"
    #   Windows: "C:/Users/yourname/Pictures/FUSOU/custom-screenshots"
    external_screenshot_directory = ""


    [app.autostart]
    # Whether to enable the Tauri autostart integration
    # default is false
    # Requires restart to take effect.
    enable = false


    [app.theme]
    # The theme to use for the application
    # you can choose between "light" and "dark"
    theme = "light"


    [app.font]
    # The font family to use for the application
    # Choose any Google Fonts family (https://fonts.google.com/?subset=japanese) or a system-installed font
    # keep it empty to use the default font
    font_family = "FGゼロラバウル"


    [app.discord]
    # Whether to enable Discord integration (Discord Rich Presence)
    # Requires restart to take effect.
    enable_discord_integration = true

    # Whether to use a custom message for Discord Rich Presence
    # Requires restart to take effect.
    use_custom_message = true

    # The custom message to use for Discord Rich Presence
    # This option is only used when `use_custom_message` is true
    # Requires restart to take effect.
    custom_message = "This is experimental implementation"

    # The custom details line to use for Discord Rich Presence
    # This option is only used when `use_custom_message` is true
    # Requires restart to take effect.
    custom_details = "Playing KanColle with FUSOU"

    # Whether to use a custom image for Discord Rich Presence
    # Requires restart to take effect.
    use_custom_image = true

    # The custom image url to use for Discord Rich Presence
    # This option is only used when `use_custom_image` is true
    # Requires restart to take effect.
    custom_image_url = "https://avatars.githubusercontent.com/u/68815462?v=4"


    [app.map_cell_labels]
    # URL of the FUSOU-WEB map cell label bundle used by FUSOU-APP
    # Requires restart to take effect.
    bundle_url = "https://fusou.dev/battle-maps/cell_labels.json"


    [app.database]
    # Cloud sync options require [app.auth].allow_auth = true

    # Whether to sync KanColle data to the shared database (Cloudflare R2)
    # Requires restart to take effect.
    allow_data_to_shared_cloud = true

    # Whether to save KanColle data to the local filesystem
    # Requires restart to take effect.
    allow_data_to_local = true

    # Cron schedule for integration jobs (e.g., local FS or cloud storage integration)
    # Format: "sec min hour day month day_of_week"
    # Example: "0 0 * * * *" runs every hour
    # Requires restart to take effect.
    integration_schedule_cron = "0 0 * * * *"

    [app.database.r2]
    # HTTPS endpoint provided by FUSOU-WEB that mediates Cloudflare R2 uploads
    upload_endpoint = "https://fusou.dev/api/battle-data/upload"
    # Master-data upload endpoint
    master_data_upload_endpoint = "https://fusou.dev/api/master-data/upload"

    [app.database.local]
    # Base directory used when writing KanColle data locally
    # leave it empty to use the Documents directory/FUSOU/storage path
    # Requires restart to take effect.
    output_directory = ""

    # Batch size for local filesystem integration operations
    # Higher values = faster but more memory usage
    # LocalFS can handle larger batches due to local I/O speed
    # Default is 500 (can adjust down for memory-constrained systems)
    integration_batch_size = 500


    [app.asset_sync]
    # Whether asset upload worker (Cloudflare R2) is enabled
    # default is false
    # Requires restart to take effect.
    asset_upload_enable = true

    # The polling interval (in seconds) for scanning the cache directory
    # Requires restart to take effect.
    scan_interval_seconds = 30

    # HTTPS endpoint provided by FUSOU-WEB that mediates Cloudflare R2 uploads
    # Requires restart to take effect.
    asset_upload_endpoint = "https://fusou.dev/api/asset-sync/upload"

    # Optional explicit snapshot upload endpoint (if empty, origin derived from asset_upload_endpoint)
    fleet_snapshot_endpoint = "https://fusou.dev/api/fleet/snapshot"

    # Endpoint returning the latest kc_period_tag timestamp to decide when uploads can restart
    # Requires restart to take effect.
    kc_period_endpoint = "https://fusou.dev/api/kc-period/latest"

    # Endpoint returning a cached list of existing R2 asset keys (1 hour TTL)
    # Requires restart to take effect.
    asset_existing_keys_endpoint = "https://fusou.dev/api/asset-sync/keys"

    # Extensions (without dot) that must never be uploaded to Cloudflare R2
    # Requires restart to take effect.
    asset_skip_extensions = ["mp3", "woff2", "js"]


    [app.asset_sync.retry]
    # Maximum number of retry attempts for failed uploads
    max_attempts = 10

    # Time to live (in seconds) for pending upload files
    # Files older than this will be deleted
    ttl_seconds = 2592000 # 30 days

    # Interval (in seconds) between retry attempts
    # Requires restart to take effect.
    interval_seconds = 900 # 15 minutes (base for exponential backoff)

    # Cooldown (in seconds) after an authentication failure before retrying
    auth_backoff_seconds = 600

    # Minimum wait time (in seconds) between individual items within a single retry batch run.
    # Set to 0 to disable the wait. Increase to reduce CPU/network load during large retry batches.
    item_interval_seconds = 5


    [app.auth]
    # Master switch for anonymous authentication and all cloud sync features
    # When false, FUSOU will not authenticate or upload data to cloud endpoints (local saving still works)
    # default is false
    # Requires restart to take effect.
    allow_auth = true

    # Authentication page URL
    # The URL to open when authentication is required
    auth_page_url = "https://fusou.dev/auth/local/signin"

    # v2 anonymous-sync endpoints (pepper + Ed25519 device key)
    # Standard path for current builds.
    # On first launch, the client calls register to obtain device_id.
    # After registration, it uses challenge -> refresh to renew dataset_token.
    # Device revoke is intentionally unavailable until account ownership can be verified.
    anonymous_sync_v2_register_endpoint = "https://fusou.dev/api/auth/anonymous-sync/v2/register"
    anonymous_sync_v2_challenge_endpoint = "https://fusou.dev/api/auth/anonymous-sync/v2/challenge"
    anonymous_sync_v2_refresh_endpoint = "https://fusou.dev/api/auth/anonymous-sync/v2/refresh"
    anonymous_sync_v2_complete_endpoint = "https://fusou.dev/api/auth/anonymous-sync/v2/pending/{token}/complete"

    [app.quest_tree_sender]
    # Whether to enable quest tree data ingestion
    # default is false
    # Requires restart to take effect.
    enable = true

    # Whether to save quest tree data locally as JSON Lines (.jsonl)
    # Files are written under [app.database.local].output_directory (or the default local storage path)
    # default is false
    # Requires restart to take effect.
    allow_data_to_local = true

    # Endpoint to ingest quest tree data (e.g., WEB D1 ingest endpoint)
    # If empty, quest tree sender is disabled
    # Requires restart to take effect.
    ingest_endpoint = "https://fusou.dev/api/quest-tree/ingest"

    [app.ship_growth_sender]
    # Whether to enable ship growth data ingestion
    # default is false
    # Requires restart to take effect.
    enable = true

    # Whether to save ship growth (parameter progression) data locally as JSON Lines (.jsonl)
    # Files are written under [app.database.local].output_directory (or the default local storage path)
    # default is false
    # Requires restart to take effect.
    allow_data_to_local = true

    # Endpoint to ingest ship growth data
    # If empty, ship growth sender is disabled
    # Requires restart to take effect.
    ingest_endpoint = "https://fusou.dev/api/ship-growth/ingest"

    [app.soku_speed_sender]
    # Whether to enable speed observed data collection
    # default is false
    # Requires restart to take effect.
    enable = true

    # Whether to save soku_speed observed data locally as JSON Lines (.jsonl)
    # Files are written under [app.database.local].output_directory (or the default local storage path)
    # default is false
    # Requires restart to take effect.
    allow_data_to_local = true

    # Endpoint to ingest soku_speed observed data
    # Requires restart to take effect.
    ingest_endpoint = "https://fusou.dev/api/soku-speed-observed/ingest"

    [app.remodel_sender]
    # Whether to enable remodel tree data ingestion (experimental feature)
    # This sends your remodel recipe observations to help build the remodel tree.
    # default is false
    # Requires restart to take effect.
    enable = true

    # Whether to save remodel data locally as JSON Lines (.jsonl)
    # Files are written under [app.database.local].output_directory (or the default local storage path)
    # default is false
    # Requires restart to take effect.
    allow_data_to_local = true

    # Endpoint to ingest remodel data
    # Must be set when enable=true
    # Requires restart to take effect.
    ingest_endpoint = "https://fusou.dev/api/remodel-data/ingest"

    [app.kc_window]
    # The debounce time (in milliseconds) for window resize events
    # This option is used when you use linux platform and the system internally uses wayland instead of X11
    # Requires restart to take effect.
    resize_debounce_millis = 200

    # The duration (in milliseconds) to keep the KanColle window size when resized events occur
    # This option is used when you use linux platform and the system internally uses wayland instead of X11
    keep_window_size_duration_millis = 1000

    # The maximum inner width of the KanColle window
    # Requires restart to take effect.
    max_inner_width = 1920

    # The maximum inner height of the KanColle window
    # Requires restart to take effect.
    max_inner_height = 1080

    # The default inner width of the KanColle window (used for keeping aspect ratio when resizing)
    # Requires restart to take effect.
    default_inner_width = 1200

    # The default inner height of the KanColle window (used for keeping aspect ratio when resizing)
    # Requires restart to take effect.
    default_inner_height = 720

    # Window layout mode: "separate" (two windows) or "combined" (single docked window)
    # Requires restart to take effect.
    window_mode = "combined"

    # Dock position of FUSOU-APP panel in combined mode: "auto", "right", "bottom", "left", "top"
    # "auto" selects "right" in landscape and "bottom" in portrait (mobile-friendly).
    dock_position = "auto"

    # Ratio (%) of the FUSOU-APP panel relative to the workspace axis in combined mode (15 - 80)
    dock_panel_ratio_percent = 40


    [app.ui.tabs]
    # Show or hide top-level tabs in FUSOU-APP (Settings tab is always visible)
    show_fleet = true
    show_ship = true
    show_equip = true
    show_item = true
    show_quest = true
    show_uploads = true
    show_logs = true
    show_policy = true

    [app.ui.fleet_tab]
    # Show/hide and initial expanded state for sections inside the Fleet tab
    show_materials = true
    open_materials = false
    show_fleets = true
    open_fleets = true
    show_repair_docks = true
    open_repair_docks = false
    show_air_bases = true
    open_air_bases = false
    open_air_base_squadrons = false
    show_battles = true
    open_battles = true

    [app.ui.fleets]
    # Show/hide and initial expanded state for each fleet (1st - 4th Fleet)
    show_condition_value = false
    show_fleet_1 = true
    open_fleet_1 = true
    show_fleet_2 = true
    open_fleet_2 = false
    show_fleet_3 = true
    open_fleet_3 = false
    show_fleet_4 = true
    open_fleet_4 = false

    [app.ui.items]
    # Show/hide and initial expanded state for the Items list and each item shelf
    show_items = true
    open_items = true
    show_normal = true
    open_normal = true
    show_special = true
    open_special = true
    show_purchased = true
    open_purchased = true
    show_furniture = true
    open_furniture = true

    [app.ui.quests]
    # Show/hide and initial expanded state for the Quests list and each quest category
    show_quests = true
    open_quests = true
    show_accepted = true
    open_accepted = true
    show_available = true
    open_available = true
    show_completed = true
    open_completed = true


[env]
# Environment-specific configurations
# Keep it empty for now
