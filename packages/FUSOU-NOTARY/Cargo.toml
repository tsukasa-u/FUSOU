[package]
name = "fusou-notary"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Standalone TLSNotary v0.1.0-alpha.15 Notary for FUSOU"

[lib]
name = "fusou_notary"
path = "src/lib.rs"

[[bin]]
name = "fusou-notary"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
bincode = "1.3"
futures = "0.3"
k256 = { version = "0.13", features = ["ecdsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.38", features = ["macros", "net", "rt-multi-thread", "io-util", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
tlsn = { git = "https://github.com/tlsnotary/tlsn.git", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec", version = "0.1.0-alpha.15", features = ["mozilla-certs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
hyper = { version = "1.1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["full"] }
rand = "0.9"
tlsn-formats = { git = "https://github.com/tlsnotary/tlsn.git", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec" }
tlsn-server-fixture = { git = "https://github.com/tlsnotary/tlsn.git", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec" }
tlsn-server-fixture-certs = { git = "https://github.com/tlsnotary/tlsn.git", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec" }

[patch."https://github.com/tlsnotary/tlsn-utils"]
tlsn-mux = { path = "../tlsn-mux-alpha15" }
