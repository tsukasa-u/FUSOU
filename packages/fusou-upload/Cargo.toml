[package]
name = "fusou-upload"
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1.0", features = ["rt", "time", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tracing = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
fusou-auth = { path = "../fusou-auth" }
configs = { path = "../configs" }
sha2 = "0.10"
hex = "0.4"
dashmap = "5.5"

# Storage
object_store = { version = "0.13", default-features = false, features = ["aws"] }

# Error handling
bytes = "1.0"

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "net", "io-util"] }
datafusion = { version = "54", default-features = false, features = ["parquet", "sql"] }
parquet = { version = "58", default-features = false, features = ["arrow"] }
arrow-array = { version = "58" }
arrow-schema = { version = "58" }
